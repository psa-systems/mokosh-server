---

# Development environment for Mokosh Server.
# Usage: docker compose up   (COMPOSE_FILE=compose.dev.yml is set in .env)
#
# Naming convention (see ~/.claude/CLAUDE.md):
# - Project name `dev-mokosh` namespaces every resource under the
#   `dev-mokosh-` prefix in `docker ps`, `docker volume ls`, and
#   `docker network ls`. Service keys are short and descriptive
#   (`server`, `infisical`, `infisical-postgres`, `valkey`) - they do not
#   repeat the `mokosh` segment, since the project name already carries it.
# - `container_name:` is set explicitly on every service with the
#   `dev-mokosh-{descriptive}-${USER}` shape so multiple developers can
#   run their own dev stacks on a shared host without colliding on
#   container/volume/network names. `USER` is injected into .env by
#   `just dev` (captured via `whoami`).
# - Sub-services keep their parent's segment before the resource type, so
#   the volume `dev-mokosh-infisical-postgres-data-${USER}` sorts
#   adjacent to its parent in alphabetical listings.
#
# This stack contains the Mokosh API server plus its secrets-management
# infrastructure (Infisical + its Postgres + Valkey). The Mokosh client
# apps run separately (see ../mokosh-clients) and reach the API on its
# published port (MOKOSH_HOST_BIND_IP:MOKOSH_PORT) and Infisical on its
# published loopback port (127.0.0.1:28002).
#
# The Mokosh API server runs as the `server` service, reachable inside
# the compose network as `server:${MOKOSH_PORT}` and on the host at
# `${MOKOSH_HOST_BIND_IP}:${MOKOSH_PORT}`. The host bind targets a
# private LAN interface (e.g. br0/eth0) instead of 127.0.0.1 so other
# Docker containers on the host can reach it; the private IP is not
# routable from the public internet on a VPS.
#
# Discover the host IP with:
#   sys net | where name =~ 'eth0|br0' | get ip.0 | where protocol == 'ipv4'
#
# The Mokosh application database runs inside this stack as the
# `postgres` service (separate from `infisical-postgres`, which is for
# Infisical only). Server reaches it via in-network DNS at
# `postgres:5432`. The container is also published to the host so
# host-side tools (sqlx-cli via `just migrate-run`) can connect via
# `${MOKOSH_HOST_BIND_IP}:${MOKOSH_PG_HOST_PORT}` (default 5433 to
# avoid clashing with any host-side postgres on 5432).
#
# This file contains no hardcoded values. Every environment variable is
# sourced from .env (which is created from .env.dev by `just dev`).
# Required-but-empty values use the `${VAR:?...}` form so compose fails
# loudly with a helpful message instead of starting a misconfigured stack.

name: dev-mokosh

services:

  # PostgreSQL database for Infisical (internal only).
  infisical-postgres:
    profiles: ["infisical"]
    container_name: dev-mokosh-infisical-postgres-${USER:?USER missing - run via just dev}
    # https://hub.docker.com/_/postgres
    image: postgres:18.2-alpine3.23
    environment:
      POSTGRES_DB: ${INFISICAL_PG_DB:?INFISICAL_PG_DB missing - run `just dev` (which copies .env.dev to .env)}
      POSTGRES_USER: ${INFISICAL_PG_USER:?INFISICAL_PG_USER missing - run `just dev` (which copies .env.dev to .env)}
      POSTGRES_PASSWORD: ${INFISICAL_PG_PASSWORD:?INFISICAL_PG_PASSWORD missing - run `just dev` (which copies .env.dev to .env)}
    networks:
      - private
    expose:
      - "5432"
    volumes:
      - infisical-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prefer Valkey over Redis (required by Infisical). Internal only.
  # Only Infisical consumes Valkey, so gate it behind the same profile to
  # keep it from starting when the infisical profile is not selected.
  valkey:
    profiles: ["infisical"]
    container_name: dev-mokosh-valkey-${USER:?USER missing - run via just dev}
    # https://hub.docker.com/r/valkey/valkey
    image: docker.io/valkey/valkey:8-alpine
    networks:
      - private
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Infisical secrets manager (admin UI reachable from the host).
  infisical:
    profiles: ["infisical"]
    container_name: dev-mokosh-infisical-${USER:?USER missing - run via just dev}
    image: infisical/infisical:v0.161.0
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?INFISICAL_ENCRYPTION_KEY missing - run `just dev` (which copies .env.dev to .env)}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?INFISICAL_AUTH_SECRET missing - run `just dev` (which copies .env.dev to .env)}
      DB_CONNECTION_URI: ${INFISICAL_DB_CONNECTION_URI:?INFISICAL_DB_CONNECTION_URI missing - run `just dev` (which copies .env.dev to .env)}
      REDIS_URL: ${INFISICAL_REDIS_URL:?INFISICAL_REDIS_URL missing - run `just dev` (which copies .env.dev to .env)}
      SITE_URL: ${INFISICAL_SITE_URL:?INFISICAL_SITE_URL missing - run `just dev` (which copies .env.dev to .env)}
      TELEMETRY_ENABLED: ${INFISICAL_TELEMETRY_ENABLED:?INFISICAL_TELEMETRY_ENABLED missing - run `just dev` (which copies .env.dev to .env)}
    networks:
      - private
    ports:
      - "127.0.0.1:28002:8080"
    depends_on:
      infisical-postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # PostgreSQL database for the Mokosh API server (the app's primary
  # store, separate from Infisical's). Reachable in-network as
  # `postgres:5432` and on the host as
  # `${MOKOSH_HOST_BIND_IP}:${MOKOSH_PG_HOST_PORT}` for sqlx-cli.
  postgres:
    container_name: dev-mokosh-postgres-${USER:?USER missing - run via just dev}
    # https://hub.docker.com/_/postgres
    image: postgres:18.2-alpine3.23
    environment:
      POSTGRES_DB: ${MOKOSH_PG_DB:-mokosh}
      POSTGRES_USER: ${MOKOSH_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${MOKOSH_PG_PASSWORD:-postgres}
      # PMS-285: passwords for the split request-serving roles, provisioned by
      # the entrypoint below so `just dev` boots with RLS active at runtime.
      MOKOSH_MIGRATOR_PASSWORD: ${MOKOSH_MIGRATOR_PASSWORD:-mokosh_migrator_dev}
      MOKOSH_APP_PASSWORD: ${MOKOSH_APP_PASSWORD:-mokosh_app_dev}
      # Postgres 18 changed the default PGDATA from /var/lib/postgresql/
      # data to /var/lib/postgresql/<major>/docker. We pin it back into
      # the named volume so state survives container recreates regardless
      # of the upstream image's default. Using a `pgdata` subdir of the
      # mount point sidesteps the postgres-entrypoint quirk that refuses
      # to initdb into a non-empty directory.
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - private
    ports:
      - "${MOKOSH_HOST_BIND_IP:-127.0.0.1}:${MOKOSH_PG_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The postgres image only honours POSTGRES_PASSWORD on first
    # volume init; subsequent runs against an existing volume keep
    # whatever password was baked in originally. With dev volumes
    # shared across session-rebuilds, that password regularly drifts
    # from the current env value and the server fails to connect
    # ("password authentication failed for user 'postgres'"). The
    # entrypoint wrapper below runs the normal docker-entrypoint
    # in the background, waits for the unix socket to come up
    # (peer-trusted for the postgres user inside the container),
    # idempotently `ALTER USER`s the password back to
    # `$POSTGRES_PASSWORD`, then waits on the postgres process for
    # the foreground. First-init paths still go through the standard
    # docker-entrypoint flow; this only fixes the "existing volume,
    # drifted password" case.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        docker-entrypoint.sh postgres &
        pg_pid=$$!
        # Wait for the unix socket (not TCP) so the ALTER below
        # uses peer-trust, sidestepping the very password we want
        # to reset.
        until pg_isready -U "$$POSTGRES_USER" -h /var/run/postgresql -q 2>/dev/null; do
            sleep 1
        done
        psql -U "$$POSTGRES_USER" -h /var/run/postgresql -d "$$POSTGRES_DB" \
            -c "ALTER USER \"$$POSTGRES_USER\" WITH PASSWORD '$$POSTGRES_PASSWORD'" \
            || echo "[entrypoint] ALTER USER failed (socket not trust-mode?); continuing"
        # PMS-285: provision the split DB roles idempotently. `mokosh_migrator`
        # (BYPASSRLS) runs migrations/bootstrap; `mokosh_app` (NOBYPASSRLS) is
        # the request-serving role. CREATE is allowed to fail on an existing
        # role (|| true), then ALTER reconciles the password/attributes. The
        # ALTER DEFAULT PRIVILEGES lines make every table the migrator creates
        # in later migrations auto-grant to mokosh_app, so the order (provision
        # before the server runs migrations) is what matters, not pre-existing
        # tables. Peer-trusted via the unix socket, like the ALTER USER above.
        P="psql -U $$POSTGRES_USER -h /var/run/postgresql -d $$POSTGRES_DB -q"
        $$P -c "CREATE ROLE mokosh_migrator LOGIN BYPASSRLS PASSWORD '$$MOKOSH_MIGRATOR_PASSWORD'" 2>/dev/null || true
        $$P -c "ALTER ROLE mokosh_migrator LOGIN BYPASSRLS PASSWORD '$$MOKOSH_MIGRATOR_PASSWORD'" || echo "[entrypoint] alter mokosh_migrator failed; continuing"
        $$P -c "CREATE ROLE mokosh_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD '$$MOKOSH_APP_PASSWORD'" 2>/dev/null || true
        $$P -c "ALTER ROLE mokosh_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD '$$MOKOSH_APP_PASSWORD'" || echo "[entrypoint] alter mokosh_app failed; continuing"
        $$P -c "GRANT ALL ON SCHEMA public TO mokosh_migrator" || true
        $$P -c "GRANT CONNECT ON DATABASE \"$$POSTGRES_DB\" TO mokosh_app" || true
        $$P -c "GRANT USAGE ON SCHEMA public TO mokosh_app" || true
        $$P -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO mokosh_app" || true
        $$P -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO mokosh_app" || true
        $$P -c "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO mokosh_app" || true
        $$P -c "ALTER DEFAULT PRIVILEGES FOR ROLE mokosh_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO mokosh_app" || true
        $$P -c "ALTER DEFAULT PRIVILEGES FOR ROLE mokosh_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO mokosh_app" || true
        $$P -c "ALTER DEFAULT PRIVILEGES FOR ROLE mokosh_migrator IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO mokosh_app" || true
        # Pre-create the extensions the migrations need. The public-schema
        # migrations want uuid-ossp + pg_trgm (migration 002); the mokosh-auth
        # subsystem migrations also want citext + pgcrypto. These extensions are
        # untrusted, so only a superuser can CREATE them; the unprivileged
        # mokosh_migrator that runs both migration sets cannot. Every migration
        # uses CREATE EXTENSION IF NOT EXISTS, so once they exist here the
        # migration step is a no-op. Done as POSTGRES_USER (superuser) over the
        # socket, like the role provisioning above.
        $$P -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\"" || echo "[entrypoint] create extension uuid-ossp failed; continuing"
        $$P -c "CREATE EXTENSION IF NOT EXISTS pg_trgm" || echo "[entrypoint] create extension pg_trgm failed; continuing"
        $$P -c "CREATE EXTENSION IF NOT EXISTS citext" || echo "[entrypoint] create extension citext failed; continuing"
        $$P -c "CREATE EXTENSION IF NOT EXISTS pgcrypto" || echo "[entrypoint] create extension pgcrypto failed; continuing"
        # The mokosh-auth bootstrap (which runs as mokosh_migrator, see
        # main.rs try_bootstrap_sso -> migrator_pool) does CREATE SCHEMA
        # mokosh_auth. CREATE SCHEMA needs the CREATE privilege on the database,
        # which a plain BYPASSRLS role lacks; grant it so the auth schema and
        # its tables are created + owned by mokosh_migrator.
        $$P -c "GRANT CREATE ON DATABASE \"$$POSTGRES_DB\" TO mokosh_migrator" || echo "[entrypoint] grant create-on-db to mokosh_migrator failed; continuing"
        echo "[entrypoint] mokosh_migrator / mokosh_app roles provisioned"
        wait "$$pg_pid"

  # Mailpit captures every outgoing email locally. mokosh-server points
  # SMTP_HOST=mailpit in the dev env (see the server service below); the
  # web UI is at http://localhost:8025. State is intentionally
  # ephemeral - no volume mount, restart clears the inbox. See
  # docs/mokosh-smtp/01-dev-mailcatcher.md.
  mailpit:
    container_name: dev-mokosh-mailpit-${USER:?USER missing - run via just dev}
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DELIVER: "false"
    networks:
      - private
    ports:
      # Loopback-only on both ports. Multiple developers on the same
      # box can collide on the host's 1025/8025; if you hit that,
      # publish on a different host port (mailpit's internal ports
      # stay 1025/8025 either way).
      - "127.0.0.1:1025:1025"  # SMTP submission (mokosh-server -> mailpit)
      - "127.0.0.1:8025:8025"  # web UI (developer browser)

  # Mokosh API server. Built from the dev Dockerfile; source mounted for
  # live reload via `cargo run`.
  server:
    container_name: dev-mokosh-server-${USER:?USER missing - run via just dev}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: ${MOKOSH_PORT:?MOKOSH_PORT missing - run `just dev` (which copies .env.dev to .env)}
      ENVIRONMENT: development
      BASE_URL: http://${MOKOSH_HOST_BIND_IP:-127.0.0.1}:${MOKOSH_PORT}

      # Reach the in-stack postgres by service-DNS name. PMS-285: the split
      # roles activate RLS at runtime. DATABASE_URL connects as the privileged
      # `mokosh_migrator` (BYPASSRLS) - it runs migrations + bootstrap + the
      # cross-tenant workers; MOKOSH_APP_DATABASE_URL connects as the
      # unprivileged `mokosh_app` (NOBYPASSRLS) used for every request-serving
      # query, so a forgotten `WHERE tenant_id` filter fail-closes to zero rows.
      # Both roles are provisioned by the postgres service entrypoint.
      DATABASE_URL: postgres://mokosh_migrator:${MOKOSH_MIGRATOR_PASSWORD:-mokosh_migrator_dev}@postgres:5432/${MOKOSH_PG_DB:-mokosh}
      MOKOSH_APP_DATABASE_URL: postgres://mokosh_app:${MOKOSH_APP_PASSWORD:-mokosh_app_dev}@postgres:5432/${MOKOSH_PG_DB:-mokosh}

      # Outbound email. Dev defaults point at the mailpit service
      # alongside this one; messages land in http://localhost:8025.
      # Production deploys override these via secrets; setting
      # SMTP_HOST empty drops back to LogMailer (links go to docker
      # logs). See docs/mokosh-smtp/03-config-and-bootstrap.md.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Display name MUST NOT contain unquoted parens; they're RFC 5322
      # comment syntax. If you want "Mokosh (dev)" wrap it in quotes
      # at the env-var level.
      SMTP_FROM: ${SMTP_FROM:-Mokosh Dev <noreply@mokosh.localdev>}
      SMTP_TLS: ${SMTP_TLS:-none}

      # Inside the compose network, reach Infisical by service-DNS, not the
      # published localhost port.
      INFISICAL_BASE_URL: http://infisical:8080
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-dev}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing - run `just dev` (which copies .env.dev to .env)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY missing - run `just dev` (which copies .env.dev to .env)}

      # mokosh-auth (SSO / OIDC) configuration. The server boots without
      # SSO if these are missing (legacy auth still serves /api/v1/*) so
      # the optional `:-` form is intentional. Generate the keypair with
      # `scripts/gen-oidc-key.sh`; the script writes into ./secrets which
      # is mounted read-only into the container at /app/secrets below.
      MOKOSH_AUTH_ISSUER: ${MOKOSH_AUTH_ISSUER:-}
      MOKOSH_AUTH_COOKIE_DOMAIN: ${MOKOSH_AUTH_COOKIE_DOMAIN:-}
      MOKOSH_AUTH_JWT_PRIVATE_KEY_PATH: ${MOKOSH_AUTH_JWT_PRIVATE_KEY_PATH:-}
      MOKOSH_AUTH_JWT_ACTIVE_KID: ${MOKOSH_AUTH_JWT_ACTIVE_KID:-}
      MOKOSH_AUTH_JWT_PUBLIC_KEYS_DIR: ${MOKOSH_AUTH_JWT_PUBLIC_KEYS_DIR:-}
      MOKOSH_AUTH_DATA_ENCRYPTION_KEY: ${MOKOSH_AUTH_DATA_ENCRYPTION_KEY:-}
      MOKOSH_AUTH_DATA_ENCRYPTION_KEY_PREV: ${MOKOSH_AUTH_DATA_ENCRYPTION_KEY_PREV:-}
      MOKOSH_AUTH_DATA_KEY_VERSION: ${MOKOSH_AUTH_DATA_KEY_VERSION:-1}
      MOKOSH_AUTH_ACCESS_TOKEN_TTL: ${MOKOSH_AUTH_ACCESS_TOKEN_TTL:-600}
      MOKOSH_AUTH_REFRESH_TOKEN_TTL: ${MOKOSH_AUTH_REFRESH_TOKEN_TTL:-2592000}
      MOKOSH_AUTH_REFRESH_IDLE_TTL: ${MOKOSH_AUTH_REFRESH_IDLE_TTL:-1209600}
      MOKOSH_AUTH_OP_SESSION_TTL: ${MOKOSH_AUTH_OP_SESSION_TTL:-604800}

      # Google OAuth login. Consumed by the google-oauth-flow workspace
      # crate (Config::from_env()). The two secrets are required; the
      # redirect URI defaults to the dev localhost callback.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID missing - paste the dev OAuth client id into .env}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?GOOGLE_OAUTH_CLIENT_SECRET missing - paste the dev OAuth client secret into .env}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:4301/api/v1/auth/google/callback}

      # The exact origin the callback HTML postMessages tokens to.
      # Must equal the browser-visible client origin byte-for-byte.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4301}

      # Comma-separated, lowercased email-domain allowlist. First-time
      # Google sign-ins from these domains are auto-promoted to
      # role 'super_admin'. Existing users are never re-roled.
      OAUTH_SUPER_ADMIN_DOMAINS: ${OAUTH_SUPER_ADMIN_DOMAINS:-niceguyit.biz}

      # First-run admin bootstrap (DEV ONLY). Ignored once any user exists.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      RUST_LOG: ${RUST_LOG:-info,mokosh_server=debug}
    networks:
      - private
    ports:
      # Host port 4302 by default so the client dev stack can keep host
      # 4301 for the SPA + Dioxus dev-server proxy. Container port is
      # MOKOSH_PORT (4301) - the API itself still listens on 4301 inside
      # the network.
      - "${MOKOSH_HOST_BIND_IP:-127.0.0.1}:${MOKOSH_API_HOST_PORT:-4302}:${MOKOSH_PORT}"
    volumes:
      - ./src:/app/src
      - ./crates:/app/crates
      - ./Cargo.toml:/app/Cargo.toml
      - ./Cargo.lock:/app/Cargo.lock
      # build.rs captures git hash / describe / build date as
      # compile-time env vars consumed by src/version.rs. Without
      # this mount cargo sees `build = "build.rs"` in Cargo.toml,
      # cannot find the file, and fails the workspace compile.
      - ./build.rs:/app/build.rs
      - ./migrations:/app/migrations
      # OIDC signing keys generated by scripts/gen-oidc-key.sh. Mounted
      # read-only so a container compromise cannot exfiltrate or rotate
      # them in place.
      - ./secrets:/app/secrets:ro
      - server-target:/app/target
    depends_on:
      postgres:
        condition: service_healthy
      # NB: no dependency on infisical. The mokosh-server binary never
      # reads Infisical at startup (only the one-shot mokosh-bootstrap
      # CLI does), and Infisical is now opt-in behind the `infisical`
      # compose profile. A hard depends_on a profiled-out service makes
      # compose reject the whole project ("depends on undefined service
      # infisical") for every `just dev` / `just dev-sso` / `just down`.
      mailpit:
        # No healthcheck on mailpit; it accepts SMTP from cold start.
        # Wait for the container to be running, not healthy.
        condition: service_started

volumes:
  infisical-postgres-data:
    name: dev-mokosh-infisical-postgres-data-${USER:?USER missing - run via just dev}
  postgres-data:
    name: dev-mokosh-postgres-data-${USER:?USER missing - run via just dev}
  server-target:
    name: dev-mokosh-server-target-${USER:?USER missing - run via just dev}

networks:
  private:
    name: dev-mokosh-private-${USER:?USER missing - run via just dev}
