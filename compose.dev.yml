---

# Development environment for Mokosh Server.
# Usage: just dev   (brings up the Traefik-routed stack; COMPOSE_FILE is
# compose.dev.yml). PMS-511 folded the former SSO overlay in here, so the
# Traefik-routed `*.a8n.run` stack is now the only dev stack.
#
# Naming convention (see ~/.claude/CLAUDE.md):
# - Project name `dev-mokosh` namespaces every resource under the
#   `dev-mokosh-` prefix in `docker ps`, `docker volume ls`, and
#   `docker network ls`. Service keys are short and descriptive
#   (`server`, `infisical`, `infisical-postgres`, `valkey`) - they do not
#   repeat the `mokosh` segment, since the project name already carries it.
# - `container_name:` is set explicitly on every service with the
#   `dev-mokosh-{descriptive}-${USER}` shape so multiple developers can
#   run their own dev stacks on a shared host without colliding on
#   container/volume/network names. `USER` is injected into .env by
#   `just dev` (captured via `whoami`).
# - Sub-services keep their parent's segment before the resource type, so
#   the volume `dev-mokosh-infisical-postgres-data-${USER}` sorts
#   adjacent to its parent in alphabetical listings.
#
# This stack contains the Mokosh API server plus its secrets-management
# infrastructure (Infisical + its Postgres + Valkey, behind the `infisical`
# profile). The Mokosh client apps run separately (see ../mokosh-apps) and
# reach the API through Traefik at https://${USER}-mokosh-api.a8n.run.
#
# The Mokosh API server runs as the `server` service, reachable inside the
# compose network as `server:${MOKOSH_PORT}`. It publishes no LAN-IP host
# port: the shared Traefik (on the external `traefik-public` network) is the
# sole ingress and terminates TLS via Let's Encrypt, routing
# https://${USER}-mokosh-api.a8n.run to the container's $MOKOSH_PORT (see the
# server's `labels` below).
#
# MOKOSH_HOST_BIND_IP is still discovered and written to .env by `just dev`, but
# nothing in this file consumes it. It is deliberately NOT used to publish any
# host port: postgres and mailpit publish on loopback only (PMS-496), so
# host-side tooling (sqlx-cli, the mail UI) reaches them via localhost while the
# LAN/internet cannot, and the server is reachable through Traefik alone.
# Discover the host IP with:
#   sys net | where name =~ 'eth0|br0' | get ip.0 | where protocol == 'ipv4'
#
# The Mokosh application database runs inside this stack as the
# `postgres` service (separate from `infisical-postgres`, which is for
# Infisical only). Server reaches it via in-network DNS at
# `postgres:5432`. The container is also published to the host on
# loopback so host-side tools (sqlx-cli via `just migrate-run`) can
# connect via `127.0.0.1:${MOKOSH_PG_HOST_PORT}` (default 5433 to
# avoid clashing with any host-side postgres on 5432).
#
# This file contains no hardcoded values. Every environment variable is
# sourced from .env (which is generated from .env.example by `just dev`).
# Required-but-empty values use the `${VAR:?...}` form so compose fails
# loudly with a helpful message instead of starting a misconfigured stack.

name: dev-mokosh

services:

  # PostgreSQL database for Infisical (internal only).
  infisical-postgres:
    profiles: ["infisical"]
    container_name: dev-mokosh-infisical-postgres-${USER:?USER missing - run via just dev}
    # https://hub.docker.com/_/postgres
    image: postgres:18.2-alpine3.23
    environment:
      POSTGRES_DB: ${INFISICAL_PG_DB:?INFISICAL_PG_DB missing - run `just dev` (which generates .env from .env.example)}
      POSTGRES_USER: ${INFISICAL_PG_USER:?INFISICAL_PG_USER missing - run `just dev` (which generates .env from .env.example)}
      POSTGRES_PASSWORD: ${INFISICAL_PG_PASSWORD:?INFISICAL_PG_PASSWORD missing - run `just dev` (which generates .env from .env.example)}
    networks:
      - private
    expose:
      - "5432"
    volumes:
      - infisical-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prefer Valkey over Redis (required by Infisical). Internal only.
  # Only Infisical consumes Valkey, so gate it behind the same profile to
  # keep it from starting when the infisical profile is not selected.
  valkey:
    profiles: ["infisical"]
    container_name: dev-mokosh-valkey-${USER:?USER missing - run via just dev}
    # https://hub.docker.com/r/valkey/valkey
    image: docker.io/valkey/valkey:8-alpine
    networks:
      - private
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Infisical secrets manager (admin UI reachable from the host).
  infisical:
    profiles: ["infisical"]
    container_name: dev-mokosh-infisical-${USER:?USER missing - run via just dev}
    image: infisical/infisical:v0.161.0
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?INFISICAL_ENCRYPTION_KEY missing - run `just dev` (which generates .env from .env.example)}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?INFISICAL_AUTH_SECRET missing - run `just dev` (which generates .env from .env.example)}
      DB_CONNECTION_URI: ${INFISICAL_DB_CONNECTION_URI:?INFISICAL_DB_CONNECTION_URI missing - run `just dev` (which generates .env from .env.example)}
      REDIS_URL: ${INFISICAL_REDIS_URL:?INFISICAL_REDIS_URL missing - run `just dev` (which generates .env from .env.example)}
      SITE_URL: ${INFISICAL_SITE_URL:?INFISICAL_SITE_URL missing - run `just dev` (which generates .env from .env.example)}
      TELEMETRY_ENABLED: ${INFISICAL_TELEMETRY_ENABLED:?INFISICAL_TELEMETRY_ENABLED missing - run `just dev` (which generates .env from .env.example)}
    networks:
      - private
    ports:
      - "127.0.0.1:28002:8080"
    depends_on:
      infisical-postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # PostgreSQL database for the Mokosh API server (the app's primary
  # store, separate from Infisical's). Reachable in-network as
  # `postgres:5432` and on the host as `127.0.0.1:${MOKOSH_PG_HOST_PORT}`
  # (loopback only, PMS-496) for sqlx-cli.
  postgres:
    container_name: dev-mokosh-postgres-${USER:?USER missing - run via just dev}
    # https://hub.docker.com/_/postgres
    image: postgres:18.2-alpine3.23
    environment:
      POSTGRES_DB: ${MOKOSH_PG_DB:-mokosh}
      POSTGRES_USER: ${MOKOSH_PG_USER:-postgres}
      # PMS-496: no default. `just ensure-env` generates a per-host secret into
      # .env; fail loudly here rather than silently booting with `postgres`.
      POSTGRES_PASSWORD: ${MOKOSH_PG_PASSWORD:?MOKOSH_PG_PASSWORD missing - run `just dev` (ensure-env generates a per-host secret)}
      # PMS-489: the split request-serving roles (mokosh_migrator / mokosh_app)
      # are no longer provisioned by a postgres initdb.d script. The server
      # self-provisions them at startup from MOKOSH_ADMIN_DATABASE_URL (the
      # POSTGRES_USER superuser), so postgres only needs its own superuser env.
      # Postgres 18 changed the default PGDATA from /var/lib/postgresql/
      # data to /var/lib/postgresql/<major>/docker. We pin it back into
      # the named volume so state survives container recreates regardless
      # of the upstream image's default. Using a `pgdata` subdir of the
      # mount point sidesteps the postgres-entrypoint quirk that refuses
      # to initdb into a non-empty directory.
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - private
    ports:
      # PMS-496: published on LOOPBACK ONLY. host-side sqlx-cli (just
      # migrate-run) connects via localhost:${MOKOSH_PG_HOST_PORT}; sibling
      # containers reach this DB by in-network DNS `postgres:5432` and need no
      # host publish at all. Do NOT reintroduce MOKOSH_HOST_BIND_IP here: that
      # var is derived from the first non-loopback interface (which can be
      # public), so binding the port to it exposed the app DB - and the
      # BYPASSRLS mokosh_migrator role reachable through it - to the LAN/internet
      # with weak default credentials. If a non-loopback bind is ever genuinely
      # required, introduce an explicit private-IP env var with NO default
      # (e.g. `${MOKOSH_PG_PRIVATE_BIND_IP:?...}`) and only after a host firewall
      # is confirmed to deny 5432/5433 inbound on every non-loopback interface.
      - "127.0.0.1:${MOKOSH_PG_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mailpit captures every outgoing email locally. mokosh-server points
  # SMTP_HOST=mailpit in the dev env (see the server service below); the
  # web UI is at http://localhost:8025. State is intentionally
  # ephemeral - no volume mount, restart clears the inbox. MP_DELIVER is
  # false, so nothing leaves the box whatever SMTP_FROM says.
  mailpit:
    container_name: dev-mokosh-mailpit-${USER:?USER missing - run via just dev}
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DELIVER: "false"
    networks:
      - private
    ports:
      # Loopback-only on both ports. Multiple developers on the same
      # box can collide on the host's 1025/8025; if you hit that,
      # publish on a different host port (mailpit's internal ports
      # stay 1025/8025 either way).
      - "127.0.0.1:1025:1025"  # SMTP submission (mokosh-server -> mailpit)
      - "127.0.0.1:8025:8025"  # web UI (developer browser)

  # Mokosh API server. Built from the dev Dockerfile; source mounted for
  # live reload via `cargo run`.
  server:
    container_name: dev-mokosh-server-${USER:?USER missing - run via just dev}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: ${MOKOSH_PORT:?MOKOSH_PORT missing - run `just dev` (which generates .env from .env.example)}
      ENVIRONMENT: development
      # The server's own public base URL. Traefik is the sole ingress and this
      # service publishes no host port, so the only address that reaches it is
      # the routed hostname below (same value as OIDC_AUDIENCE).
      BASE_URL: https://${USER}-mokosh-api.a8n.run

      # Reach the in-stack postgres by service-DNS name. PMS-285: the split
      # roles activate RLS at runtime. DATABASE_URL connects as the privileged
      # `mokosh_migrator` (BYPASSRLS) - it runs migrations + bootstrap + the
      # cross-tenant workers; MOKOSH_APP_DATABASE_URL connects as the
      # unprivileged `mokosh_app` (NOBYPASSRLS) used for every request-serving
      # query, so a forgotten `WHERE tenant_id` filter fail-closes to zero rows.
      # PMS-489: the server self-provisions both roles at startup. On first boot
      # mokosh_migrator cannot connect, so the server uses MOKOSH_ADMIN_DATABASE_URL
      # (the postgres superuser) to CREATE the roles with MOKOSH_MIGRATOR_PASSWORD /
      # MOKOSH_APP_PASSWORD, then closes that pool. Subsequent boots skip it.
      # PMS-496: DB passwords carry no defaults. `just ensure-env` generates
      # per-host secrets into .env; an unset value fails the stack loudly rather
      # than silently provisioning the roles with `mokosh_*_dev` / `postgres`.
      DATABASE_URL: postgres://mokosh_migrator:${MOKOSH_MIGRATOR_PASSWORD:?MOKOSH_MIGRATOR_PASSWORD missing - run `just dev` (ensure-env generates a per-host secret)}@postgres:5432/${MOKOSH_PG_DB:-mokosh}
      MOKOSH_APP_DATABASE_URL: postgres://mokosh_app:${MOKOSH_APP_PASSWORD:?MOKOSH_APP_PASSWORD missing - run `just dev` (ensure-env generates a per-host secret)}@postgres:5432/${MOKOSH_PG_DB:-mokosh}
      MOKOSH_ADMIN_DATABASE_URL: postgres://${MOKOSH_PG_USER:-postgres}:${MOKOSH_PG_PASSWORD:?MOKOSH_PG_PASSWORD missing - run `just dev` (ensure-env generates a per-host secret)}@postgres:5432/${MOKOSH_PG_DB:-mokosh}
      MOKOSH_MIGRATOR_PASSWORD: ${MOKOSH_MIGRATOR_PASSWORD:?MOKOSH_MIGRATOR_PASSWORD missing - run `just dev` (ensure-env generates a per-host secret)}
      MOKOSH_APP_PASSWORD: ${MOKOSH_APP_PASSWORD:?MOKOSH_APP_PASSWORD missing - run `just dev` (ensure-env generates a per-host secret)}

      # Outbound email. Dev defaults point at the mailpit service
      # alongside this one; messages land in http://localhost:8025.
      # Production deploys override these via secrets; setting
      # SMTP_HOST empty drops back to LogMailer (links go to docker
      # logs). The .env.example block above these keys is the reference.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Display name MUST NOT contain unquoted parens; they're RFC 5322
      # comment syntax. If you want "Mokosh (dev)" wrap it in quotes
      # at the env-var level.
      SMTP_FROM: ${SMTP_FROM:-Mokosh Dev <noreply@mokosh.localdev>}
      SMTP_TLS: ${SMTP_TLS:-none}

      # Infisical is an opt-in profile, so this stays EMPTY on a plain
      # `just dev` and the readiness probe reports "skipped" instead of
      # 503ing against an absent host (PMS-707). `just dev-infisical`
      # writes the service-DNS URL into .env under the MOKOSH_SERVER_
      # name; the plain INFISICAL_URL in .env is the host-side localhost
      # URL that `just infisical-bootstrap` consumes, so the two contexts
      # need two names.
      INFISICAL_ADDRESS: ${MOKOSH_SERVER_INFISICAL_ADDRESS:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-dev}
      # PMS-967: `database` (the default) or `infisical`. The `:-` default
      # reproduces the code's own fallback in SecretsConfig::from_env, so an
      # unset variable behaves the same here as it does in production.
      SECRET_BACKEND: ${SECRET_BACKEND:-database}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing - run `just dev` (which generates .env from .env.example)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY missing - run `just dev` (which generates .env from .env.example)}

      # bunyip-as-OP Resource-Server verifier (the sole OP after PMS-295,
      # which removed mokosh-auth / mechanism 2). OIDC_ISSUER must equal the
      # token `iss` AND bunyip's advertised discovery issuer; OIDC_AUDIENCE
      # must equal the `audience` on the mokosh-apps oauth_clients row in
      # bunyip-api. The RS path fetches bunyip's keys over JWKS, so mokosh
      # holds no local signing key and exposes no /oauth2/* endpoints.
      OIDC_ISSUER: https://${USER}-bunyip-api.a8n.run
      OIDC_AUDIENCE: https://${USER}-mokosh-api.a8n.run

      # Browser-visible origin of the client that talks to this API. Must
      # equal it byte-for-byte: it is the CORS_ORIGIN default and the base
      # for emailed reset/invite links. PMS-837 removed the Google OAuth
      # client id/secret/redirect keys and the super-admin email allowlist
      # along with the Google sign-in routes.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4301}

      # First-run admin bootstrap (DEV ONLY). Ignored once any user exists.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # PMS-836: this map enumerates the container's environment, so a variable
      # the code reads but that has no line here CANNOT be set from .env - the
      # operator edits .env, sees no error, and the feature stays off. Every
      # remaining variable the server process reads is therefore listed below,
      # each defaulting to the fallback the code already applies when unset, so
      # an untouched .env behaves exactly as before. scripts/check-env-example.nu
      # fails `just check` if a new read is added without a line here.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-}

      # MAPPS-425 / PMS-748 / MAPPS-429: the emailed-link and email-branding
      # trio. SPA_BASE_URL falls back to CLIENT_ORIGIN, so it only needs setting
      # on a stack where the SPA is not the login origin; PUBLIC_API_BASE_URL is
      # what makes the tenant logo in a request-form email an absolute src, and
      # unset means the mail carries no logo at all.
      SPA_BASE_URL: ${SPA_BASE_URL:-}
      ABUSE_CONTACT_EMAIL: ${ABUSE_CONTACT_EMAIL:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}

      # PMS-591: shared secret for the BUNYIP-211 `account_deleted` webhook.
      # Empty falls back to the built-in dev value, which only development /
      # dev / test accept (resolve_secret, PMS-499).
      BUNYIP_WEBHOOK_SECRET: ${BUNYIP_WEBHOOK_SECRET:-}

      # PMS-587 / PMS-809: empty means "use the built-in default" for the
      # trusted-proxy ranges, and "exempt nothing" for the outbound SSRF guard.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-}
      OUTBOUND_PRIVATE_ALLOWLIST: ${OUTBOUND_PRIVATE_ALLOWLIST:-}

      # PMS-657 / BUNYIP-475 / PMS-658: login-location enrichment and the
      # notify-and-approve gate. All three are off when empty.
      IP2LOCATION_DB_PATH: ${IP2LOCATION_DB_PATH:-}
      IP2PROXY_DB_PATH: ${IP2PROXY_DB_PATH:-}
      LOGIN_APPROVAL_ENABLED: ${LOGIN_APPROVAL_ENABLED:-}

      # PMS-904: self-hosted (default) or saas. Empty means unset, which the
      # code resolves to self-hosted, so the dev stack sends every email.
      MOKOSH_DEPLOYMENT_MODE: ${MOKOSH_DEPLOYMENT_MODE:-}

      # Upload root, shared by ticket attachments and tenant logos (which live
      # in a `tenant-logos/` subdirectory of it). Defaulted to the `attachments`
      # named volume below rather than the code's CWD-relative `./attachments`,
      # so an uploaded logo survives `just dev` rebuilding the image.
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/data/attachments}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-}
      # PMS-923: KB article images. Default reproduces the code's own 5 MiB.
      KB_ATTACHMENT_MAX_BYTES: ${KB_ATTACHMENT_MAX_BYTES:-}
      TENANT_LOGO_MAX_BYTES: ${TENANT_LOGO_MAX_BYTES:-}

      # RS verifier knobs beyond the issuer/audience pair above; empty keeps the
      # built-in 600s JWKS cache and 30s clock leeway. OIDC_DEFAULT_TENANT_ID is
      # the shared landing tenant bunyip users JIT into (PMS-239).
      OIDC_JWKS_CACHE_TTL_SECS: ${OIDC_JWKS_CACHE_TTL_SECS:-}
      OIDC_LEEWAY_SECONDS: ${OIDC_LEEWAY_SECONDS:-}
      OIDC_DEFAULT_TENANT_ID: ${OIDC_DEFAULT_TENANT_ID:-}

      # Stripe REST base, overridable so a test can point checkout at a stub;
      # empty uses https://api.stripe.com.
      STRIPE_API_BASE: ${STRIPE_API_BASE:-}

      # PMS-710 demo-data gate, the template tenant its rows are copied from,
      # and the upstream version probe. All three are off/default when empty.
      MOKOSH_DEMO_SEED: ${MOKOSH_DEMO_SEED:-}
      MOKOSH_SEED_TENANT_ID: ${MOKOSH_SEED_TENANT_ID:-}
      MOKOSH_UPDATE_CHECK_URL: ${MOKOSH_UPDATE_CHECK_URL:-}

      RUST_LOG: ${RUST_LOG:-info,mokosh_server=debug}
    networks:
      - private
      - traefik-public
    # Traefik is the sole ingress for the dev stack; the server publishes no
    # LAN-IP host port. Routing and Let's Encrypt TLS termination come from the
    # shared Traefik via the labels below. (postgres still publishes its host
    # port for sqlx-cli; see that service.)
    #
    # List (sequence) syntax is REQUIRED here, not the usual map syntax.
    # Docker Compose interpolates ${USER} inside string VALUES but NOT
    # inside map KEYS (verified on Compose v2.40). The router name lives
    # in the label key, so map syntax leaves a literal `${USER}` in the
    # router name, Traefik rejects it, and the host never routes (default
    # cert + 404). In list form the whole "key=value" is one string value,
    # so ${USER} in the router name interpolates correctly.
    labels:
      - traefik.enable=true
      - traefik.docker.network=network-traefik-public
      - traefik.http.routers.mokosh-api-${USER}.rule=Host(`${USER}-mokosh-api.a8n.run`)
      - traefik.http.routers.mokosh-api-${USER}.entrypoints=nebula-secure
      - traefik.http.routers.mokosh-api-${USER}.tls.certresolver=cert-cloudflare
      - traefik.http.services.mokosh-api-${USER}.loadbalancer.server.port=${MOKOSH_PORT}
    # The bunyip-as-OP RS verifier (oidc_rs.rs) fetches
    # `${OIDC_ISSUER}/.well-known/openid-configuration`, but inside the
    # container the issuer host resolves to the box's PUBLIC edge (self-signed
    # cert + 404 on the OP path). Pin it to the LOCAL Traefik on the shared
    # network, which serves the OP with a valid Let's Encrypt cert. Override
    # BUNYIP_OP_TRAEFIK_IP in .env on a box whose Traefik publishes
    # nebula-secure on a different IP.
    extra_hosts:
      - "${USER}-bunyip-api.a8n.run:${BUNYIP_OP_TRAEFIK_IP:-172.30.0.11}"
    volumes:
      - ./src:/app/src
      - ./crates:/app/crates
      - ./Cargo.toml:/app/Cargo.toml
      - ./Cargo.lock:/app/Cargo.lock
      # build.rs captures git hash / describe / build date as
      # compile-time env vars consumed by src/version.rs. Without
      # this mount cargo sees `build = "build.rs"` in Cargo.toml,
      # cannot find the file, and fails the workspace compile.
      - ./build.rs:/app/build.rs
      - ./migrations:/app/migrations
      # PMS-640: mount the integration tests so `just pre-commit`'s
      # `cargo {check,clippy} --all-targets` inside this container compiles the
      # tests/*.rs binaries. Without this the container never sees tests/, so a
      # harness-breaking signature change (e.g. create_api_router) passed the
      # local hook and only failed in CI. `tests/` is compile-only here (the
      # Postgres-backed run stays in `just test-integration`).
      - ./tests:/app/tests
      - server-target:/app/target
      # PMS-836: uploads (ticket attachments and tenant logos) land under
      # ATTACHMENT_DIR. Without this they live in the container filesystem and
      # a rebuild loses them, so a dev tenant's logo disappears on the next
      # `just dev`. Mount point must match the ATTACHMENT_DIR default above.
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      # NB: no dependency on infisical. The mokosh-server binary reads
      # INFISICAL_ADDRESS (the readiness probe in src/api/router.rs pings
      # it, and reports "skipped" when the address is blank), but it does
      # not require Infisical to be up to boot, and Infisical is opt-in
      # behind the `infisical` compose profile. A hard depends_on a
      # profiled-out service makes compose reject the whole project
      # ("depends on undefined service infisical") for every
      # `just dev` / `just down`.
      mailpit:
        # No healthcheck on mailpit; it accepts SMTP from cold start.
        # Wait for the container to be running, not healthy.
        condition: service_started

volumes:
  infisical-postgres-data:
    name: dev-mokosh-infisical-postgres-data-${USER:?USER missing - run via just dev}
  postgres-data:
    name: dev-mokosh-postgres-data-${USER:?USER missing - run via just dev}
  server-target:
    name: dev-mokosh-server-target-${USER:?USER missing - run via just dev}
  attachments:
    name: dev-mokosh-attachments-${USER:?USER missing - run via just dev}

networks:
  private:
    name: dev-mokosh-private-${USER:?USER missing - run via just dev}
