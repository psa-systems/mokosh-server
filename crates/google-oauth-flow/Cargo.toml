[package]
name = "google-oauth-flow"
version = "0.1.0"
edition = "2021"
description = "Reusable Google OAuth 2.0 (Authorization Code + PKCE) helper. Reads its three secrets from env, returns userinfo. No web framework, no DB, no opinions about state storage."
license = "Proprietary"

[dependencies]
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = "2"

[build-dependencies]
# Shared build-script logic (PMS-198). build.rs calls build_metadata::emit().
build-metadata = { path = "../build-metadata" }
