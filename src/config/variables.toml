# Variables the server no longer reads; each keeps a doc row for old compose files.
# Unmarked when the server just ignores them; `breaking = "wont-start"` only if boot refuses them.

[[removed]]
name = "GOOGLE_OAUTH_CLIENT_ID"
since = "v0.2.0"
removed = "v0.14.0"
issue = "PMS-837"
action = "No action needed: the server ignores it. Cleanup: delete it from the compose variables; the Google sign-in routes it served are gone."

[[removed]]
name = "GOOGLE_OAUTH_CLIENT_SECRET"
since = "v0.2.0"
removed = "v0.14.0"
issue = "PMS-837"
action = "No action needed: the server ignores it. Cleanup: delete it from the compose secrets; the Google sign-in routes it served are gone."

[[removed]]
name = "GOOGLE_OAUTH_REDIRECT_URI"
since = "v0.2.0"
removed = "v0.14.0"
issue = "PMS-837"
action = "No action needed: the server ignores it. Cleanup: delete it from the compose variables; the Google sign-in routes it served are gone."

[[removed]]
name = "OAUTH_SUPER_ADMIN_EMAILS"
since = "v0.3.0"
removed = "v0.14.0"
issue = "PMS-837"
action = "No action needed: the server ignores it. Cleanup: delete it from the compose variables; only the removed Google sign-in path read it."

# Authored changelog wording, attached to the entry the facts imply; Changed may also be a behavior change.
# `breaking` is "wont-start" (restart fails) or "feature-off" (needs `feature`); either needs `issue` and `action`.

[[change]]
release = "v0.16.0"
group = "Added"
variables = ["APP_SECRET_BACKEND"]
issue = "PMS-1424"
action = "Optional. Selects where application-tier secrets live; unset keeps the hosting profile's default."

[[change]]
release = "v0.16.0"
group = "Added"
variables = ["ALLOW_UNINVITED_BUNYIP_SIGNUP"]
issue = "PMS-1457"
action = "Optional, off by default. Set `true` only where uninvited Bunyip sign-up is wanted (staging)."

[[change]]
release = "v0.16.0"
group = "Changed"
variables = ["SECRET_BACKEND"]
issue = "PMS-1424"
breaking = "feature-off"
feature = "application-tier secrets (`SMTP_PASSWORD` for outbound mail, the Google Contacts client pair)"
action = "Now selects tenant-tier secrets only. If you set it expecting application secrets (`SMTP_PASSWORD`, the Google client pair) to move too, also set `APP_SECRET_BACKEND` to the same provider before restarting."

[[change]]
release = "v0.16.0"
group = "Changed"
variables = ["GOOGLE_CONTACTS_CLIENT_ID", "GOOGLE_CONTACTS_CLIENT_SECRET"]
issue = "PMS-1430"
breaking = "feature-off"
feature = "Google Contacts import"
action = "Now an application-tier secret served by `APP_SECRET_BACKEND`'s provider, no longer a plain variable. Move both halves there (an `app_secrets` row, Infisical `/app`, a `{NAME}_FILE` compose secret or an `APP_SECRETS_DIR` file); setting only one half refuses boot."

[[change]]
release = "v0.15.0"
group = "Added"
variables = ["OIDC_BACKCHANNEL_CLIENT_ID"]
issue = "PMS-998"
action = "Optional. Set it to the OIDC client id Bunyip addresses back-channel logout tokens to; unset refuses every logout token."

[[change]]
release = "v0.15.0"
group = "Added"
variables = ["STORAGE_PROVIDER", "STORAGE_ROOT", "STORAGE_S3_ENDPOINT", "STORAGE_S3_BUCKET", "STORAGE_S3_REGION", "STORAGE_S3_PATH_STYLE", "STORAGE_S3_ACCESS_KEY_ID", "STORAGE_S3_SECRET_ACCESS_KEY"]
issue = "PMS-1317"
action = "Optional. The new name for a storage setting; the old name keeps working, so rename at your next compose edit."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["MOKOSH_DEPLOYMENT_MODE"]
issue = "PMS-1160"
action = "Set `self-hosted` or `saas` before restarting; boot refuses without it outside dev/test. Introduced by PMS-1011."

[[change]]
release = "v0.14.0"
group = "Changed"
variables = ["MOKOSH_APP_DATABASE_URL", "BASE_URL", "CLIENT_ORIGIN", "SPA_BASE_URL"]
issue = "PMS-1160"
breaking = "wont-start"
action = "Now required outside dev/test: boot refuses when it is unset instead of falling back to a localhost or single-role default. Set it before restarting."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["CONFIG_BACKEND"]
issue = "PMS-982"
action = "Optional. `environment` is the only accepted value and the default."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["CONFIG_PROVIDERS", "CONFIG_FILE_DIR", "BUNYIP_CONFIG_URL", "BUNYIP_CONFIG_CLIENT_ID", "BUNYIP_CONFIG_CLIENT_SECRET"]
issue = "PMS-987"
action = "Optional. Configuration provider chain and its construction values; unset keeps the hosting profile's default."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["AUTH_PROVIDERS"]
issue = "PMS-981"
action = "Optional. Unset keeps the hosting profile's default (`bunyip,local` in saas, `local` self-hosted)."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["APP_SECRETS_DIR"]
issue = "PMS-988"
action = "Optional. Directory the file application-secret provider reads; unset disables that provider."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["SECRET_BACKEND", "STORAGE_BACKEND"]
issue = "PMS-910"
action = "Optional. Unset keeps the default provider (`database` for secrets, `local` for storage)."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["MAIL_PROVIDER"]
issue = "PMS-1013"
action = "Optional. Unset keeps the profile default, or `smtp` when `SMTP_HOST` is set."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["BUNYIP_STATUS_CLIENT_ID", "BUNYIP_STATUS_CLIENT_SECRET"]
issue = "PMS-1193"
action = "Optional. Set both to let Bunyip read provider status with its machine credential."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["ORGANIZATIONS_ENABLED"]
issue = "PMS-983"
action = "Optional. Unset follows the hosting profile (off self-hosted, on saas)."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["KB_ATTACHMENT_MAX_BYTES"]
issue = "PMS-923"
action = "Optional. Unset keeps the built-in cap."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["BRANDING_TENANT_FAVICON_MAX_BYTES", "BRANDING_TENANT_BACKGROUND_MAX_BYTES", "BRANDING_COMPANY_LOGO_MAX_BYTES", "BRANDING_COMPANY_FAVICON_MAX_BYTES", "BRANDING_COMPANY_BACKGROUND_MAX_BYTES"]
issue = "MAPPS-622"
action = "Optional. Unset keeps the built-in cap for that asset."

[[change]]
release = "v0.14.0"
group = "Added"
variables = ["MOKOSH_MAX_TENANTS"]
issue = "MAPPS-457"
action = "Optional. Unset means no tenant cap."

[[change]]
release = "v0.12.0"
group = "Added"
variables = ["SPA_BASE_URL"]
issue = "MAPPS-425"
action = "Optional at the time (required since v0.14.0). Set it to the mokosh-apps origin so SPA-only email links land there."

[[change]]
release = "v0.12.0"
group = "Added"
variables = ["PUBLIC_API_BASE_URL", "ABUSE_CONTACT_EMAIL"]
issue = "PMS-748"
