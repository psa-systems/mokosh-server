issue = "GOV-50"
action = "Optional. Blank reports Infisical as skipped in the readiness probe."

[[change]]
release = "v0.6.0"
group = "Added"
variables = ["BUNYIP_WEBHOOK_SECRET"]
issue = "PMS-591"
action = "Set it to bunyip-api's `BUNYIP_WEBHOOK_SIGNING_SECRET` before restarting; boot refuses without it outside dev/test."

[[change]]
release = "v0.4.0"
group = "Changed"
variables = ["JWT_SECRET", "ENCRYPTION_KEY"]
issue = "PMS-499"
