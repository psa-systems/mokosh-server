---

# Mokosh Server: operator reference deployment.
#
# This file is what self-hosters and our own production stacks deploy.
# It pulls a published image from the container registry (no local
# build) and bundles the application Postgres. Secrets are sourced from
# a `.env` file alongside this compose file; copy `.env.example` and fill
# in values before the first `docker compose up`.
#
# Naming follows the convention in CLAUDE.md: every resource is prefixed
# with the application name (`mokosh-`) so `docker ps`, `docker volume
# ls`, and `docker network ls` group them together.
#
# Updating
# --------
# Operators apply updates deliberately. The running server exposes
# `GET /api/v1/version/check` which reports whether a newer image tag is
# available (see UPDATE_CHECK_URL below). To apply:
#
#   docker compose pull
#   docker compose up --detach
#
# Pin a specific version by setting `MOKOSH_VERSION=v0.2.0` in `.env`.
# When unset, Compose pulls `:latest`.

name: mokosh

services:

  postgres:
    container_name: mokosh-postgres
    # https://hub.docker.com/_/postgres
    image: postgres:18.2-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOKOSH_PG_DB:?MOKOSH_PG_DB missing - copy .env.example to .env and fill in values}
      POSTGRES_USER: ${MOKOSH_PG_USER:?MOKOSH_PG_USER missing - copy .env.example to .env and fill in values}
      POSTGRES_PASSWORD: ${MOKOSH_PG_PASSWORD:?MOKOSH_PG_PASSWORD missing - copy .env.example to .env and fill in values}
      # Postgres 18 changed the default PGDATA location; pin it under the
      # mount so state survives container recreates regardless of the
      # upstream image's default. Using a `pgdata` subdir sidesteps the
      # entrypoint quirk that refuses to initdb into a non-empty dir.
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - private
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    container_name: mokosh-server
    # MOKOSH_IMAGE lets self-hosters point at a mirror; MOKOSH_VERSION
    # lets operators pin a specific release tag instead of `:latest`.
    image: ${MOKOSH_IMAGE:-dev.a8n.run/psa-systems-private/mokosh-api}:${MOKOSH_VERSION:-latest}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: ${MOKOSH_PORT:-8080}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BASE_URL: ${BASE_URL:?BASE_URL missing - set to the public URL operators reach the API at}

      DATABASE_URL: postgres://${MOKOSH_PG_USER}:${MOKOSH_PG_PASSWORD}@postgres:5432/${MOKOSH_PG_DB}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing - generate a long random string}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY missing - exactly 32 bytes, base64 or raw}

      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN missing - comma-separated list of allowed browser origins}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

      # Update check. Points at a Forgejo/GitHub release feed that
      # returns `{"tag_name": "vX.Y.Z", ...}`. Leave unset to disable
      # the `/api/v1/version/check` endpoint.
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-https://dev.a8n.run/api/v1/repos/psa-systems/mokosh-server/releases/latest}

      # SMTP (optional). With SMTP_HOST unset the server logs would-be
      # emails to the `mokosh_auth.mailer` tracing target.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}

      # First-run admin bootstrap. Ignored once any user exists.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - private
    ports:
      - "${MOKOSH_HOST_BIND_IP:-127.0.0.1}:${MOKOSH_HOST_PORT:-8080}:${MOKOSH_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: mokosh-postgres-data

networks:
  private:
    name: mokosh-private
