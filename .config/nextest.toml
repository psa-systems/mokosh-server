# cargo-nextest configuration for the Postgres-backed `tests/*.rs` suite.
# Read by both `integration.yml` (`cargo nextest run --profile ci`) and
# `just test-integration`, so CI and the local recipe run the identical
# profile (PMS-1177).

# PMS-1394: which suites run on every pull request and which do not, decided
# HERE and in one place.
#
# A suite belongs in `UNSUPPORTED` when it covers functionality nothing
# currently uses, and when standing it up costs the job real setup. The S3
# storage suite is both: `STORAGE_BACKEND` defaults to `local` and no
# deployment sets `s3` today, and running it means pulling a MinIO image,
# extracting its server binary, checksumming it and health-polling it before a
# single assertion runs. That setup is also the fragile part - a third-party
# rehost of an archived upstream, which retracted anonymous pulls once already
# and broke this job on every branch at once (PMS-1390).
#
# What is deliberately NOT given up: the code stays, the tests stay, and they
# are still COMPILED by the pull-request job, because `cargo nextest archive`
# builds every `tests/*.rs` binary whatever the filter says. A change that
# stops `tests/s3_storage.rs` compiling still fails the PR. What moves is only
# how often the assertions are executed, to weekly in
# `integration-unsupported.yml`.
#
# The two filters are complements over the same list, so a suite is in exactly
# one of them and adding a second unsupported suite is one edit in each. Do not
# repeat either expression in a workflow: a filter in a YAML file is a second
# home for this decision, and the point of putting it here is that the local
# recipe and CI cannot disagree about what ran.

[profile.ci]
# Everything except the unsupported suites. `default-filter` rather than an
# `-E` on the command line so `just test-integration` and the CI job select the
# same set without either naming it.
default-filter = 'not binary(s3_storage)'

# nextest schedules test CASES across every archived binary at once instead
# of running one binary to completion before starting the next (what
# `cargo test --tests` did), which is the whole point of the switch: most of
# the previous wall clock was one binary waiting on the previous one.
#
# 12 is chosen against the Postgres service's default `max_connections` of
# 100, the same budget the old `--test-threads=4` (per binary) comment
# guarded. Each in-flight `#[sqlx::test]` case holds a per-test database pool
# plus the shared sqlx-test maintenance pool, and this is now the ONLY
# concurrency knob (global, not per-binary), so it is set well under the
# limit rather than at it. Lower it if `PoolTimedOut` appears in a run.
test-threads = 12
fail-fast = false

# Replaces the shell `timeout --signal=QUIT` wrapper and the grep for "has
# been running for over" in integration.yml: nextest names the slow or
# terminated test itself, so there is no diagnostic to get wrong. A case
# running past 60s is reported as slow; one still running after three more
# periods (180s total) is sent SIGTERM and the run continues rather than the
# whole job stalling on it.
[profile.ci.slow-timeout]
period = "60s"
terminate-after = 3

# The p99 assertion in this test measures /health latency against a 30ms
# bound while 15 concurrent logins run; under the shared 12-thread budget
# above it contends with up to 11 other DB-heavy cases, so a loaded runner
# can push its wall-clock p99 past the bound with no code regression (PMS-1283,
# observed in PR #837 #824 #839 #843 #844 #846). Reserving the whole
# test-thread budget for it means its p99 measures the code and not its
# neighbours; the bound and the test body stay unchanged.
[[profile.ci.overrides]]
filter = 'test(health_p99_does_not_regress_under_concurrent_argon2_burst)'
threads-required = "num-test-threads"

# PMS-1394: the complement of `ci`, run weekly by
# `integration-unsupported.yml` and locally by
# `just test-integration-unsupported`.
#
# It inherits `ci`'s settings by naming it as its base, so the slow-timeout,
# the failure policy and the thread budget cannot drift from the suite this one
# was split out of. Only the filter differs.
[profile.unsupported]
inherits = "ci"
default-filter = 'binary(s3_storage)'

# The whole point of this profile is a suite that needs external setup, so a
# failure has to say what it was. Printing the output of a failing case
# immediately means the weekly run's log carries the reason without anyone
# re-running it locally with a MinIO of their own.
failure-output = "immediate-final"
