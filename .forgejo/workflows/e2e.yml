---

# Playwright E2E suite against a deployed instance (PMS-140 phase 1;
# PMS-141 promotion to merge gate; PMS-271 staging/production secret split).
#
# Environments (PMS-271): CI holds staging and production config side by side.
# The bare `E2E_*` Forgejo Actions secrets ARE the staging set (unchanged);
# production adds a parallel `E2E_PRODUCTION_*` set. The job env: block selects
# between them per var and exposes the result on the plain `E2E_*` names, so
# env.ts and the gate scripts never need to know which environment they target.
# Automatic triggers (push, PR) always resolve to the bare staging secrets;
# production runs only on a manual dispatch that selects it (the suite is
# write-heavy and shares one rate-limited account, so it must not churn live
# prod unattended).
#
# Triggers:
#   - push to main: post-merge validation against staging. Runs the deploy-sync
#     gate (`wait-for-deploy.mjs`) so it asserts staging is actually serving
#     the pushed commit before the suite runs.
#   - pull_request targeting main (including release/* PRs): merge gate against
#     staging. PR SHAs never deploy to staging, so the version gate is replaced
#     with a `/api/v1/health` reachability check; the suite still runs against
#     whatever staging is currently serving. The intended semantics is
#     "staging is healthy and the suite passes against it".
#   - workflow_dispatch: manual ad-hoc runs. `environment=staging` (default)
#     behaves like a post-merge run (deploy-sync gate). `environment=production`
#     targets prod; the dispatched SHA is unlikely to be what prod serves, so
#     it runs the reachability check instead of the SHA-polling gate.
#
# To make this a real gate, add `e2e` to the required status checks on the
# main branch in Forgejo branch protection. PMS-141 sets a stability bar
# (10 consecutive green post-merge runs) before flipping that switch.
name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment for the manual run
        type: choice
        default: staging
        options:
          - staging
          - production

# Back-to-back runs (post-merge + PR + multi-PR) must not collide on the
# shared E2E tenant and single account (per-email login rate limit is 5/min,
# see src/modules/auth/routes.rs). Serialise across ALL triggers via a
# single group; do NOT cancel in progress, so post-merge runs always
# complete and every PR commit gets exercised once it makes it through the
# queue. Slow throughput is the trade-off; throughput beats correctness is
# never the right answer for an auth-rate-limited gate.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright against staging
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}

    defaults:
      run:
        working-directory: e2e

    # PMS-271: select staging vs production per var and expose on the plain
    # E2E_* name. The bare E2E_* secrets ARE staging; E2E_PRODUCTION_* is the
    # production override. On push / pull_request the `inputs` context is empty,
    # so `inputs.environment == 'production'` is false and every var resolves to
    # its bare staging secret; on a manual dispatch the operator's choice drives
    # it. env.ts and the gate scripts read the plain E2E_* names and stay
    # environment-agnostic.
    env:
      E2E_BASE_URL: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_BASE_URL || secrets.E2E_BASE_URL }}
      E2E_EMAIL: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_EMAIL || secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_PASSWORD || secrets.E2E_PASSWORD }}
      E2E_TENANT_ID: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_TENANT_ID || secrets.E2E_TENANT_ID }}
      E2E_OIDC_CLIENT_ID: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_OIDC_CLIENT_ID || secrets.E2E_OIDC_CLIENT_ID }}
      E2E_OIDC_REDIRECT_URI: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_OIDC_REDIRECT_URI || secrets.E2E_OIDC_REDIRECT_URI }}
      E2E_OP_BASE_URL: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_OP_BASE_URL || secrets.E2E_OP_BASE_URL }}
      E2E_TOTP_SECRET: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_TOTP_SECRET || secrets.E2E_TOTP_SECRET }}
      E2E_FOREIGN_COMPANY_ID: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_FOREIGN_COMPANY_ID || secrets.E2E_FOREIGN_COMPANY_ID }}
      # The opensuse-base runner does not grant write access to the default
      # /opt/hostedtoolcache, so actions/setup-node fails when it tries to
      # cache the downloaded Node tarball. Point the tool cache at a path the
      # runner can write. ${{ runner.* }} cannot be referenced from job-env
      # (Forgejo schema rejects it: the runner context is not yet bound),
      # so use a fixed path under /tmp.
      RUNNER_TOOL_CACHE: /tmp/toolcache

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # wait-for-deploy.mjs walks `git log` from GITHUB_SHA back to the
          # most recent commit that touched a build-trigger path. A shallow
          # clone would stop at depth 1 and the walk would miss or fail.
          fetch-depth: 0

      - name: Prepare tool cache directory
        # Absolute path; default working-directory (e2e/) is irrelevant.
        run: mkdir -p "$RUNNER_TOOL_CACHE"

      - name: Set up Node.js
        uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # --with-deps shells out to apt-get, which the OpenSUSE runner does
        # not have. The runner image carries the X / GTK / NSS libs Chromium
        # needs already; if a future image trims them down, add a `zypper
        # install -y` step here for the missing sonames.
        run: npx playwright install chromium

      # PMS-271: a production dispatch must NOT run the SHA-polling gate - the
      # dispatched commit is unlikely to be what prod currently serves, so the
      # version-sync poll would time out. Version-sync runs on push and on a
      # staging dispatch; reachability runs on pull_request and on a production
      # dispatch.
      - name: Wait for deploy to serve this commit (push / staging dispatch)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
        run: node scripts/wait-for-deploy.mjs

      - name: Verify deployment is reachable (pull_request / production dispatch)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
        run: node scripts/health-check.mjs

      - name: Run E2E suite
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
