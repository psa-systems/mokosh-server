---

# Playwright E2E suite against a deployed instance (PMS-140 phase 1;
# PMS-141 promotion to merge gate; PMS-271 staging/production secret split).
#
# Environments (PMS-271): CI holds both staging and production config side by
# side as Forgejo Actions secrets, and the job env: block selects per var and
# exposes the result on the plain `E2E_*` names, so env.ts and the gate scripts
# never need to know which environment they target. Secret names follow the
# deployment's own variable names where one exists (MOKOSH_OIDC_CLIENT_ID,
# MOKOSH_APPS_REDIRECT_URIS_*, OIDC_ISSUER_*; see the env: block below);
# test-only vars with no deployment equivalent keep the E2E_STAGING_* /
# E2E_PRODUCTION_* names. Automatic triggers (push, PR) always resolve to
# staging; production runs only on a manual dispatch that selects it (the suite
# is write-heavy and shares one rate-limited account, so it must not churn live
# prod unattended).
#
# Triggers:
#   - push to main: post-merge validation against staging. Runs the deploy-sync
#     gate (`wait-for-deploy.mjs`) so it asserts staging is actually serving
#     the pushed commit before the suite runs.
#   - pull_request targeting main (including release/* PRs): merge gate against
#     staging. PR SHAs never deploy to staging, so the version gate is replaced
#     with a `/api/v1/health` reachability check; the suite still runs against
#     whatever staging is currently serving. The intended semantics is
#     "staging is healthy and the suite passes against it".
#   - workflow_dispatch: manual ad-hoc runs. `environment=staging` (default)
#     behaves like a post-merge run (deploy-sync gate). `environment=production`
#     targets prod; the dispatched SHA is unlikely to be what prod serves, so
#     it runs the reachability check instead of the SHA-polling gate.
#
# To make this a real gate, add `e2e` to the required status checks on the
# main branch in Forgejo branch protection. PMS-141 sets a stability bar
# (10 consecutive green post-merge runs) before flipping that switch.
name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment for the manual run
        type: choice
        default: staging
        options:
          - staging
          - production

# Back-to-back runs (post-merge + PR + multi-PR) must not collide on the
# shared E2E tenant and single account (per-email login rate limit is 5/min,
# see src/modules/auth/routes.rs). Serialise across ALL triggers via a
# single group; do NOT cancel in progress, so post-merge runs always
# complete and every PR commit gets exercised once it makes it through the
# queue. Slow throughput is the trade-off; throughput beats correctness is
# never the right answer for an auth-rate-limited gate.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright against staging
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    defaults:
      run:
        working-directory: e2e

    # PMS-271: select the staging vs production secret per var and expose it on
    # the plain E2E_* name that env.ts and the gate scripts read. On push /
    # pull_request the `inputs` context is empty, so `inputs.environment ==
    # 'production'` is false and every var resolves to its staging secret; a
    # manual dispatch lets the operator pick.
    #
    # Secret names follow the deployment's own variable names where one exists
    # (verified against the mokosh infra repo, server/{c-01 staging, nc-01
    # production}):
    #   - E2E_OIDC_CLIENT_ID  -> MOKOSH_OIDC_CLIENT_ID. The mokosh-apps public
    #     PKCE client, seeded by bunyip-api with the SAME id in both envs, so a
    #     single shared secret (no _STAGING/_PRODUCTION split).
    #   - E2E_OIDC_REDIRECT_URI -> MOKOSH_APPS_REDIRECT_URIS (bunyip-api),
    #     per-env (msp.a8n.systems vs msp.psa.systems).
    #   - E2E_OP_BASE_URL     -> OIDC_ISSUER (mokosh-server), the bunyip OP apex
    #     (api.a8n.systems vs api.psa.systems), per-env.
    # The rest are test-only (no deployment equivalent) and keep the E2E_* name.
    # Forgejo must hold both env values at once, so per-env secrets carry a
    # _STAGING/_PRODUCTION suffix on the deployment base name.
    env:
      E2E_BASE_URL: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_BASE_URL || secrets.E2E_STAGING_BASE_URL }}
      E2E_EMAIL: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_EMAIL || secrets.E2E_STAGING_EMAIL }}
      E2E_PASSWORD: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_PASSWORD || secrets.E2E_STAGING_PASSWORD }}
      E2E_TENANT_ID: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_TENANT_ID || secrets.E2E_STAGING_TENANT_ID }}
      # Shared across envs (identical bunyip-seeded client id), so no switch.
      E2E_OIDC_CLIENT_ID: ${{ secrets.MOKOSH_OIDC_CLIENT_ID }}
      E2E_OIDC_REDIRECT_URI: ${{ inputs.environment == 'production' && secrets.MOKOSH_APPS_REDIRECT_URIS_PRODUCTION || secrets.MOKOSH_APPS_REDIRECT_URIS_STAGING }}
      E2E_OP_BASE_URL: ${{ inputs.environment == 'production' && secrets.OIDC_ISSUER_PRODUCTION || secrets.OIDC_ISSUER_STAGING }}
      E2E_TOTP_SECRET: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_TOTP_SECRET || secrets.E2E_STAGING_TOTP_SECRET }}
      E2E_FOREIGN_COMPANY_ID: ${{ inputs.environment == 'production' && secrets.E2E_PRODUCTION_FOREIGN_COMPANY_ID || secrets.E2E_STAGING_FOREIGN_COMPANY_ID }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # wait-for-deploy.mjs walks `git log` from GITHUB_SHA back to the
          # most recent commit that touched a build-trigger path. A shallow
          # clone would stop at depth 1 and the walk would miss or fail.
          fetch-depth: 0

      # No Node setup step: the opensuse-dev runner image (PMS-423) ships
      # nodejs24 and bun, so the runtime is already on disk. Using the
      # preinstalled toolchain avoids a redundant Node download and the
      # /tmp/toolcache workaround that actions/setup-node needed on this image.
      # The suite standardises on bun for dependency install and Playwright
      # invocation; Node scripts run on the concrete `node24` binary.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        # The opensuse-dev image pre-bakes the @playwright/test 1.60.0 browser
        # binaries (chromium, firefox, webkit) plus every system library they
        # need (via zypper, with the Ubuntu-only libs WebKit wants vendored
        # under /usr/local/lib/playwright). No --with-deps: it shells out to
        # apt-get, which Leap does not have. This step is a fast no-op when the
        # project's @playwright/test version matches the image's pre-baked
        # revision; it self-heals if the two ever drift.
        run: bun x playwright install chromium firefox webkit

      # PMS-271: a production dispatch must NOT run the SHA-polling gate - the
      # dispatched commit is unlikely to be what prod currently serves, so the
      # version-sync poll would time out. Version-sync runs on push and on a
      # staging dispatch; reachability runs on pull_request and on a production
      # dispatch.
      - name: Wait for deploy to serve this commit (push / staging dispatch)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
        run: node24 scripts/wait-for-deploy.mjs

      - name: Verify deployment is reachable (pull_request / production dispatch)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
        run: node24 scripts/health-check.mjs

      - name: Run E2E suite
        run: bun x playwright test

      - name: Upload Playwright report and traces
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
