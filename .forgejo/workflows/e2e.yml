---

# Playwright E2E suite against the deployed staging instance (PMS-140).
#
# Runs after every merge to main (push to main). This phase is post-merge and
# informational - it is NOT a merge gate (that is PMS-141). Before testing, the
# job waits for staging to actually serve the pushed commit (deploy-sync gate),
# so it never tests a stale deployment.
name: E2E (staging)

on:
  push:
    branches:
      - main

# Back-to-back merges to main must not run two suites against the same shared
# E2E tenant and single account at once (per-email login rate limit is 5/min,
# see src/modules/auth/routes.rs). Serialise but do not cancel: every merged
# commit must be exercised, not just the latest.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright against staging
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}

    defaults:
      run:
        working-directory: e2e

    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_TENANT_ID: ${{ secrets.E2E_TENANT_ID }}
      E2E_OIDC_CLIENT_ID: ${{ secrets.E2E_OIDC_CLIENT_ID }}
      E2E_OIDC_REDIRECT_URI: ${{ secrets.E2E_OIDC_REDIRECT_URI }}
      E2E_FOREIGN_COMPANY_ID: ${{ secrets.E2E_FOREIGN_COMPANY_ID }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Set up Node.js
        uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for staging to serve this commit
        run: node scripts/wait-for-deploy.mjs

      - name: Run E2E suite
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
