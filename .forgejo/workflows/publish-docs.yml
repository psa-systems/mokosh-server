---

# Publish this repo's docs to docs.a8n.systems/docs/mokosh-server on every push
# to main. Mirrors psa-systems/sarracenia's own publish-docs workflow.
#
# The pushing binary is the `latest` artifact from psa-systems' Forgejo Generic
# Packages, not a build from HEAD; it lags HEAD by one sarracenia main-push
# cycle by design. The target site, base path and include/exclude globs live
# in sarracenia.toml at the repo root; the only values this workflow carries
# are the runner shape, the publisher binary's registry location, and the
# secret mapping.
name: Publish docs

on:
  push:
    branches:
      - main
  # Manual retries after an intermittent failure. The first step rejects a
  # dispatch from a non-main ref so a feature branch never publishes its docs.
  workflow_dispatch:

jobs:
  publish:
    name: Publish docs to docs.a8n.systems
    # Base-medium: one HTTP download plus one `sarracenia push`, no compile.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    permissions:
      contents: read
    env:
      # Literal, not `${{ github.repository_owner }}`: the sarracenia binary is
      # published under psa-systems regardless of which consumer runs the
      # workflow, so the Generic Packages URL stays the same across the fleet.
      PACKAGE_OWNER: psa-systems
      PACKAGE_NAME: sarracenia
      BINARY_FILE: sarracenia-linux-x86_64

    steps:
      - name: Guard - main branch only
        shell: nu {0}
        env:
          REF: ${{ github.ref }}
        run: |
          if $env.REF != "refs/heads/main" {
            print --stderr $"publish-docs is restricted to main; ref was ($env.REF)"
            exit 1
          }

      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # provenance.rs in sarracenia reads git log for the push provenance
          # object; a shallow clone makes it fall back to a sparse record.
          fetch-depth: 0
          persist-credentials: false

      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@main

      - name: Download sarracenia binary from Generic Packages (latest)
        shell: nu {0}
        env:
          # Step-scoped: a job-scoped secret resolves to an empty string inside
          # a nu step on this runner.
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_PAT }}
        run: |
          let auth = [Authorization $"token ($env.FORGEJO_TOKEN)"]
          let url = (
            $env.GITHUB_SERVER_URL
            | url parse
            | update path ([
                "api" "packages" $env.PACKAGE_OWNER
                "generic" $env.PACKAGE_NAME
                "latest" $env.BINARY_FILE
              ] | str join "/")
            | url join
          )
          print $"Downloading ($url)"
          let dest = $"./($env.BINARY_FILE)"
          http get --headers $auth $url | save $dest
          chmod +x $dest
          ^$dest --version

      - name: Publish docs
        shell: nu {0}
        env:
          # Step-scoped for the same reason FORGEJO_TOKEN is above. Also keeps
          # the token's env lifetime to this one step.
          SARRACENIA_TOKEN: ${{ secrets.DOCS_A8N_SYSTEMS_SARRACENIA }}
        run: |
          # sarracenia walks from cwd (src/lib.rs current_dir()); cd into the
          # docs/public/ directory so docs/public/ is the walk root. The
          # sidebar then renders content directly under the top-level entry
          # rather than nested under "Docs > Public" synthetic layers.
          #
          # --no-media: sarracenia derives the Storefront media library path
          # from base_path (lowercase `docs/mokosh-server`); Storefront's
          # normalize_media_library_path requires the first segment to match
          # one of ["Images","Videos","Docs","Logos","Audio","Other"] case-
          # sensitively, so the lowercase `docs` is refused 400. Drop this
          # flag once either sarracenia maps base_path to the canonical root
          # or Storefront's validator calls its own canonical_root_name helper.
          let bin = $"($env.GITHUB_WORKSPACE)/($env.BINARY_FILE)"
          cd docs/public
          ^$bin push --no-media

      - name: Report job metrics
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@main
