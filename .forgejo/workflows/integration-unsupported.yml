---

# PMS-1394: the suites that do NOT run on every pull request.
#
# `integration.yml` beside this one is the merge gate and runs the supported
# suites. This workflow runs their complement: the tests for functionality
# nothing currently uses, whose setup costs the job real time and is the part
# most likely to break for reasons that have nothing to do with the commit.
# Today that is `tests/s3_storage.rs` alone.
#
# The split is NOT written here. `.config/nextest.toml` carries it, as a
# `default-filter` on the `ci` and `unsupported` profiles, so this workflow
# names a profile and never a suite; a filter expression in two YAML files
# would be a second home for the decision and the local recipes would have no
# way to agree with it. Adding a suite to the unsupported set is one edit in
# that file.
#
# What is deliberately not given up: the code stays and the tests stay, and
# `integration.yml` still COMPILES every `tests/*.rs` binary on every pull
# request, because `cargo nextest archive` builds them whatever the filter
# says. A change that stops `tests/s3_storage.rs` compiling still fails the
# PR. Only the assertions move to a schedule.
#
# Weekly rather than per-PR, and Monday morning rather than the weekend, so a
# break is found by somebody who is at a desk that day. `workflow_dispatch` is
# how you run it on demand, which is what to do on a PR that touches
# `src/storage/` before merging it.
#
# DEV-612 / scripts/check-single-build.nu: this workflow compiles and declares
# neither `push: main` nor `pull_request: main`, so it gates nothing and
# repeats nothing. It is a scheduled check, not a merge gate; the gate is
# `integration.yml`.
name: Integration (unsupported)

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  integration-unsupported:
    name: unsupported integration tests
    # Dev label: this job runs `cargo nextest` natively on the runner, and only
    # the dev image ships the C toolchain + OpenSSL headers that needs. Base
    # fails at `linker cc not found` (PMS-706), the same reason integration.yml
    # carries this label.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    # The same outer backstop integration.yml carries, and for the same reason:
    # nextest's own slow-timeout reports a stuck case, this only stops a wedge
    # elsewhere in the job from running to the runner's limit. The suite itself
    # is four cases, so the budget is almost entirely the cold compile.
    timeout-minutes: 30

    # The S3 suite boots the app, so it needs the same Postgres every other
    # suite does.
    services:
      postgres:
        image: postgres:18.2-alpine3.23
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      RUST_BACKTRACE: 1

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        # PMS-1177: nextest schedules test CASES from every archived binary
        # concurrently instead of running one `tests/*.rs` binary to
        # completion before starting the next, which is where most of the
        # previous wall clock went.
        #
        # PMS-1251: `cargo install --locked cargo-nextest` compiled nextest
        # and its dependency tree from source on every cache-miss run (717
        # `Compiling` lines total, 333 of them nextest's own tree; every run
        # logged `No cache found` on 2026-09-17, per DEV-758). A pinned
        # release archive replaces it. get.nexte.st publishes no checksum
        # file, so the archive's SHA-256 is pinned here and verified with
        # `sha256sum --check --strict`, the same pattern the MinIO step below
        # uses for the same reason.
        #
        # `ghcr.io/niceguyit/rust-builder-glibc` sets CARGO_HOME=/usr/local/cargo
        # and puts only that on PATH, not `~/.cargo/bin` (`~` is `/root` in
        # this image but `/root/.cargo/bin` is never added to PATH). Installing
        # there left the binary on disk but invisible to `cargo`, which reports
        # a plain "no such command: `nextest`" with no hint that the install
        # step ran at all. `${CARGO_HOME:-$HOME/.cargo}/bin` is where `cargo`
        # actually looks.
        env:
          NEXTEST_VERSION: "0.9.145"
          NEXTEST_SHA256: "32aa82416099eb12fffae9cf1a279ad201fecbd3f74826c613e32e9006b29867"
        run: |
          set -euo pipefail
          curl --silent --fail --location --output /tmp/nextest.tar.gz \
            "https://get.nexte.st/${NEXTEST_VERSION}/linux"
          echo "${NEXTEST_SHA256}  /tmp/nextest.tar.gz" | sha256sum --check --strict
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "${cargo_bin}"
          tar --extract --gzip --file /tmp/nextest.tar.gz --directory "${cargo_bin}"

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see "Concurrency
        # cap" in CI.md of dev.a8n.run/niceguyit/governance; not a file in
        # this repository).
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Start MinIO for the S3 storage suite
        # PMS-958. `tests/s3_storage.rs` round-trips the S3 backend against a
        # real object store and skips (loudly) when STORAGE_S3_ENDPOINT is unset, so
        # this step is what makes it run here. A `services:` entry cannot do
        # it: the MinIO image carries no command, `server /data` has to be
        # passed, and Forgejo (like GitHub) service containers have no
        # `command` key and `--entrypoint` takes a binary without arguments.
        # So the pinned release binary runs in the job.
        #
        # The binary comes OUT OF THE IMAGE rather than from a download.
        # MinIO archived the open-source server: dl.min.io answers 410 Gone
        # for every community release and the GitHub release assets are gone,
        # and quay.io/minio/minio (and docker.io/minio/minio) then dropped
        # anonymous pull access too, so anonymous token requests come back
        # with an empty `actions:` array and every digest and tag returns
        # 401. That broke this job on every branch at once.
        #
        # The still-pullable source is docker.io/bitnamilegacy/minio, which
        # ships the same MinIO server binary (mainline server, still open
        # source) at /opt/bitnami/minio/bin/minio. The binary is a
        # DEVELOPMENT build rather than a signed RELEASE; the S3 suite
        # exercises the S3 API, not a release identity, so a DEVELOPMENT
        # build is functionally identical for this test. Bump both the
        # digest and MINIO_SHA256 in the same commit, and bump the compose
        # tag with them: `compose.dev.yml` runs the same image for
        # `just dev-s3` so dev and CI take MinIO from one place.
        #
        # Pinned by IMAGE DIGEST, not by tag, so a re-push under the same
        # tag cannot change what runs here; the checksum stays as the
        # second belt. `docker create` + `docker cp` rather than
        # `docker run`, because the job container and a sibling container
        # are not on the same network by default, and taking the binary out
        # keeps the health check on 127.0.0.1 where the rest of this step
        # already expects it. Jobs reach the runner's daemon
        # (`container.docker_host: "-"`), which is the same access
        # `build-oci-image.yml` uses.
        #
        # Only this suite sets STORAGE_PROVIDER=s3, in its own process; the
        # variables below are read by nothing else, so every other suite
        # keeps exercising the local backend.
        env:
          MINIO_IMAGE: docker.io/bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
          MINIO_SHA256: 0586fed6e33767430230d2f5bafd0d2f4ea2b844ce17025593dd7ab07f5f33c2
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::MinIO pin is for linux-amd64; runner is $(uname -m)"
            exit 1
          fi
          docker pull --quiet "${MINIO_IMAGE}"
          container="$(docker create "${MINIO_IMAGE}")"
          # Removed even when the copy fails, or a retried job leaks a
          # container per attempt onto the shared runner daemon.
          trap 'docker rm --volumes "${container}" > /dev/null 2>&1 || true' EXIT
          docker cp "${container}":/opt/bitnami/minio/bin/minio /tmp/minio
          echo "${MINIO_SHA256}  /tmp/minio" | sha256sum --check --strict
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=mokosh MINIO_ROOT_PASSWORD=mokosh-ci-password \
            nohup /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 \
            > /tmp/minio.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9000/minio/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:9000/minio/health/live > /dev/null || {
            echo "::error::MinIO did not become healthy; log follows"
            cat /tmp/minio.log
            exit 1
          }
          {
            echo "STORAGE_S3_ENDPOINT=http://127.0.0.1:9000"
            echo "STORAGE_S3_BUCKET=mokosh-ci"
            echo "STORAGE_S3_REGION=us-east-1"
            echo "STORAGE_S3_PATH_STYLE=true"
            echo "STORAGE_S3_ACCESS_KEY_ID=mokosh"
            echo "STORAGE_S3_SECRET_ACCESS_KEY=mokosh-ci-password"
          } >> "$GITHUB_ENV"

      - name: Disable Postgres durability
        # PMS-1251: this `postgres` service is thrown away with the job, so
        # fsync/synchronous_commit/full_page_writes buy crash safety this
        # database never needs to survive into. Measured locally against
        # postgres:18.2-alpine3.23 on 2026-09-17: the 229-migration run drops
        # from 1.12-1.32s to 0.60-0.71s and `CREATE DATABASE ... TEMPLATE`
        # from 104-146ms to 35-39ms. PMS-1254 moved the migration run to once
        # per job, so what is paid about 1,300 times per run is now the clone.
        # Kept out of
        # scripts/test-db-roles.sql, which also runs against the dev cluster,
        # whose data a developer keeps. All three settings are reloadable, so
        # no restart is needed. ON_ERROR_STOP is not optional, for the same
        # reason the DB-roles step below sets it.
        run: |
          psql "${DATABASE_URL}" --set=ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET synchronous_commit = off;
          ALTER SYSTEM SET full_page_writes = off;
          SELECT pg_reload_conf();
          SQL
          psql "${DATABASE_URL}" --set=ON_ERROR_STOP=1 --command 'SHOW fsync'

      - name: Create the DB roles the migrations grant to
        # PMS-988: migration 207 (`app_secrets`) ends with `GRANT ... TO
        # mokosh_app`, and Postgres rejects a GRANT to a role that does not
        # exist (42704), so every test in the suite failed at migration 207
        # before its body ran. A real deployment never reaches
        # that: `provision_roles` creates the split roles at startup, before
        # the migrations run. This job has no server startup, so the step that
        # prepares the cluster creates the role instead. The statement lives in
        # a file because `just ensure-test-db-roles` runs the same one against
        # the dev cluster; scripts/test-db-roles.sql says why only the name is
        # reproduced.
        #
        # ON_ERROR_STOP is not optional: psql exits 0 on a failed statement
        # without it, which would put the failure back where it was, in the
        # test output rather than here.
        run: psql "${DATABASE_URL}" --set=ON_ERROR_STOP=1 --file scripts/test-db-roles.sql

      - name: Unsupported integration tests
        # `--profile unsupported` is the whole selection: its `default-filter`
        # in `.config/nextest.toml` is the complement of the `ci` profile's, so
        # this step runs exactly what the merge gate skips and no suite can
        # fall between the two. Nothing is named here on purpose.
        #
        # No archive step, unlike `integration.yml`. That split exists there to
        # keep a cold compile out of a step timed against a ten-minute budget;
        # here the run is four cases and there is no budget to protect, so a
        # second copy of the archive dance would be ceremony.
        #
        # A failure in this job does NOT mean the tree is broken: it means
        # something nothing currently uses has stopped working, or that the
        # MinIO pin above went stale the way it did in PMS-1390. Read the
        # failure before treating it as a code regression.
        run: |
          started=$(date +%s)
          set +e
          cargo nextest run --profile unsupported
          status=$?
          set -e
          echo "Unsupported suite took $(( $(date +%s) - started ))s"
          exit "${status}"
