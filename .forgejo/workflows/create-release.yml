---

# Create a Forgejo release when a release/* branch is merged to main. The
# publish job is psa-systems/common's reusable create-release.yml, which
# builds the changelog since the previous tag and creates the release (with
# tag) via the Forgejo API.
#
# Why the work is split into a gate job and a publish job:
# Forgejo Actions fires this workflow on every PR-closed event targeting
# `main`, but only a `release/v*` head ref should actually publish a
# release. A separate `gate` job always runs and succeeds, so the
# workflow always has at least one successful job and concludes as
# `success` whether or not a release publishes - the repo status badge
# stays green even on non-release merges. Only the `create-release` job
# carries the `contents: write` token, and it runs solely when the gate
# says so, so the write permission is never granted to the gate's
# (data-only) evaluation of attacker-controlled PR fields.
#
# Security: values under `github.event.*` (notably the PR head ref) are
# attacker-controlled and are NEVER interpolated into shell/script text.
# They are passed through the `env:` mapping and referenced as shell /
# Nushell variables ($HEAD_REF / $env.HEAD_REF) so they are treated as
# data, not code. The head ref is additionally validated against a
# strict `^release/v[0-9.]+$` pattern before any release is published.

name: Create release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  gate:
    name: Gate (release-branch merges only)
    # Medium: one bash branch-name test, no compile.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}

    # Backstop, not a target (PMS-829): one bash branch-name test, observed in
    # seconds. Nothing here can legitimately take minutes.
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      do_release: ${{ steps.gate.outputs.do_release }}
    steps:
      - name: Gate (release-branch merges only)
        id: gate
        shell: bash
        env:
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$PR_MERGED" == "true" && "$HEAD_REF" =~ ^release/v[0-9.]+$ ]]; then
            echo "do_release=true" >> "$GITHUB_OUTPUT"
            echo "This is a release-branch merge; will publish."
          else
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release-branch merge; no release will be published."
          fi

  create-release:
    name: Create release from merged PR
    needs: gate
    if: needs.gate.outputs.do_release == 'true'
    # DEV-769: the shared release job (changelog grouped by PR, FORGEJO_PAT check)
    # replaces the copy that lived here; see psa-systems/common README.
    uses: psa-systems/common/.forgejo/workflows/create-release.yml@main
    # Medium: git plus the release API, no compile.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    secrets: inherit
