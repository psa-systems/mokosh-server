---

# Create a Forgejo release when a release/* branch is merged to main.
# Extracts the version from the branch name, generates a changelog from
# git log between the previous tag and HEAD, and creates the release
# (with tag) via the Forgejo API.
#
# Why the work is split into a gate job and a publish job:
# Forgejo Actions fires this workflow on every PR-closed event targeting
# `main`, but only a `release/v*` head ref should actually publish a
# release. A separate `gate` job always runs and succeeds, so the
# workflow always has at least one successful job and concludes as
# `success` whether or not a release publishes - the repo status badge
# stays green even on non-release merges. Only the `create-release` job
# carries the `contents: write` token, and it runs solely when the gate
# says so, so the write permission is never granted to the gate's
# (data-only) evaluation of attacker-controlled PR fields.
#
# Security: values under `github.event.*` (notably the PR head ref) are
# attacker-controlled and are NEVER interpolated into shell/script text.
# They are passed through the `env:` mapping and referenced as shell /
# Nushell variables ($HEAD_REF / $env.HEAD_REF) so they are treated as
# data, not code. The head ref is additionally validated against a
# strict `^release/v[0-9.]+$` pattern before any release is published.

name: Create release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  gate:
    name: Gate (release-branch merges only)
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
    outputs:
      do_release: ${{ steps.gate.outputs.do_release }}
    steps:
      - name: Gate (release-branch merges only)
        id: gate
        shell: bash
        env:
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$PR_MERGED" == "true" && "$HEAD_REF" =~ ^release/v[0-9.]+$ ]]; then
            echo "do_release=true" >> "$GITHUB_OUTPUT"
            echo "This is a release-branch merge; will publish."
          else
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release-branch merge; no release will be published."
          fi

  create-release:
    name: Create release from merged PR
    needs: gate
    if: needs.gate.outputs.do_release == 'true'
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: write

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release
        shell: nu {0}
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_PAT }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          let branch = $env.HEAD_REF
          let tag = ($branch | str replace "release/" "")

          # Build changelog from commits since the previous tag
          let prev_tag = (do { ^git describe --tags --abbrev=0 HEAD^ } | complete)
          let changelog = if $prev_tag.exit_code == 0 {
            let prev = ($prev_tag.stdout | str trim)
            ^git log --oneline $"($prev)..HEAD" | str trim
          } else {
            # No previous tag - include all commits
            ^git log --oneline | str trim
          }

          let body = $"## Changelog\n\n($changelog)"

          let api_url = $"($env.GITHUB_SERVER_URL)/api/v1/repos/($env.GITHUB_REPOSITORY)/releases"
          let payload = {
            tag_name: $tag,
            target_commitish: "main",
            name: $tag,
            body: $body,
            draft: false,
            prerelease: false,
          }

          let response = (
            http post
              --content-type application/json
              --headers [Authorization $"token ($env.FORGEJO_TOKEN)"]
              $api_url
              $payload
          )

          print $"Release ($tag) created: ($response.html_url)"
