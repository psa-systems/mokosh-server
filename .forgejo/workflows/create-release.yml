---

# Create a Forgejo release when a release/* branch is merged to main, by calling
# the reusable workflow in psa-systems/common (PMS-786). The release logic,
# including the changelog format, lives there and is shared by every consumer.
#
# What this replaced, and where each part went (the private copy had a `gate`
# job that no other consumer carries):
#
# - The gate's branch test is now the `if:` below. It is an expression rather
#   than a bash `[[ =~ ]]` over `$HEAD_REF`, so the attacker-controlled PR field
#   is never evaluated by a shell at all, and the reusable workflow re-checks
#   both conditions as a second layer before it mints anything.
# - The gate's `contents: read` / publish-job `contents: write` split is kept by
#   construction: the caller job runs no step and holds no permission, and the
#   `contents: write` lives on the reusable job.
# - The one property that does NOT survive: the private gate always ran and
#   always succeeded, so a non-release merge still concluded the workflow as
#   `success` and kept the repo badge green. With a single `if:`-gated caller a
#   non-release merge skips the only job. That is a badge-cosmetics difference,
#   not a release-correctness one, and it is the trade every other consumer
#   already takes; PMS-786's PR body records it.
#
# `runs-on` is set on the caller job, not left to the reusable workflow: this
# Forgejo does not carry a caller's `${{ vars.* }}` into the expanded job's
# `runs-on`, so the label must resolve here. Base/medium is correct - the job
# runs git and the Forgejo API and compiles nothing.
#
# `secrets: inherit` is required. A called workflow receives no secret it is not
# passed, and the release POST needs FORGEJO_PAT (write:repository).
#
# common also accepts a `release/v*` TAG-push caller (PC-68), which it calls the
# recommended shape because the release is then cut from the reviewed tagged
# commit rather than a PR head. This repo stays on the merge trigger so that
# adopting common does not also change when a release happens; moving is a
# separate change, and `just publish-release` is the recipe it needs.
name: Create release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    uses: psa-systems/common/.forgejo/workflows/create-release.yml@main
    # Base label: the reusable job runs git and two HTTP calls to the Forgejo
    # releases API. It compiles nothing, so the dev image's C toolchain is not
    # needed. Medium is the size common's own stub specifies for it.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    secrets: inherit
