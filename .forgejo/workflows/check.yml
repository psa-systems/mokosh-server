---

# Validate code on every push and pull request: fmt, clippy, compile,
# unit tests, integration tests.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# sqlx compile-time query checks read the committed `.sqlx/` offline data
# instead of connecting to a database. Runtime sqlx calls in the
# integration tests still hit the live Postgres service below.
env:
  SQLX_OFFLINE: "true"

jobs:
  check:
    name: fmt + clippy + compile + tests
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}

    # Postgres service for `cargo test --tests`. `#[sqlx::test]` creates a
    # fresh database per invocation against the URL in DATABASE_URL, so
    # this single instance fans out to all integration tests.
    #
    # The Forgejo Actions runner puts the job container and its service
    # containers on a shared bridge network; services are reachable from
    # the job container by their service name on the container-internal
    # port. localhost would resolve to the job container itself, where
    # nothing is listening on 5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Compile check
        run: cargo check --all-targets

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests
        run: cargo test --test auth --test contacts --test tenants --test tickets
