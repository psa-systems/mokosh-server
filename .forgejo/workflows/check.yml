---

# Fast, database-free gate on every push and pull request. The Postgres-backed
# integration suite lives in a separate workflow (integration.yml) so this one
# stays fast (PMS-267).
#
# The steps below are spelled out rather than delegated to `just`, so they drift
# from the local recipes silently. `just check` covers every step here except
# the two cargo test ones, and `just pre-commit` covers those plus fmt / clippy
# / compile; running both locally covers this workflow. Keep the three in step
# and record any deliberate difference in docs/dev-docs/local-vs-ci-checks.md
# (PMS-851).
name: Check

on:
  push:
    branches:
      - main
      # PMS-825: mokosh-client-login publishes its own image tag (PMS-733) and
      # is long-lived, so no pull_request into main ever covers it. Without this
      # entry staging pulls an image whose commit never ran fmt/clippy/tests.
      # It goes away with the branch tag under PMS-824. Keep in sync with
      # BRANCH_ALLOW_LIST in oci-build/get-tags.nu; scripts/check-oci-publish-tags.nu
      # fails the build if a publishing branch is missing here.
      - mokosh-client-login
  pull_request:
    branches:
      - main

jobs:
  check:
    name: fmt + clippy + build + tests
    # Dev label: this job compiles Rust natively on the runner, and only the
    # dev image carries `cc` / `gcc` / `ld` plus the OpenSSL headers openssl-sys
    # probes. Base fails at `linker cc not found` (PMS-705, CLAUDE-203).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    steps:
      - name: Clone the repository
        # fetch-depth: 0 so the migration-immutability check can diff against
        # origin/main's history (its merge-base with this branch). DEV-395.
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Migration prefix uniqueness
        # PMS-198: fail loud when two migrations share a numeric prefix.
        # sqlx keys its `_sqlx_migrations` ledger on that prefix, so a
        # cross-branch collision (e.g. two branches both picking 027) makes
        # the applied version ambiguous. Cheap static check, runs first.
        shell: nu {0}
        run: |
          nu scripts/check-migration-prefixes.nu

      - name: Migration immutability
        # DEV-395: fail loud when a migration already committed on main is
        # modified, renamed, or deleted. sqlx verifies applied-migration
        # checksums on startup, so editing an applied migration makes every
        # deployed database refuse to boot (this broke nc-01 on the v0.4.0
        # deploy: 023_seed_data.sql was edited after it had been applied).
        shell: nu {0}
        run: |
          nu scripts/check-migration-immutability.nu

      - name: No duplicate mail copy
        # PMS-700: transactional email bodies live in notification_templates
        # and are rendered by the dispatcher. A second hard-coded copy in
        # `Mailer` made the document a recipient got depend on whether the
        # dispatcher was wired; fail loud if that copy comes back.
        shell: nu {0}
        run: |
          nu scripts/check-no-duplicate-mail-copy.nu

      - name: Pool safety (RLS tenant GUC)
        # PMS-692: a request-serving `.pool()` call hits the NOBYPASSRLS app pool
        # and fail-closes RLS-covered reads/writes to zero rows. Serving queries
        # must go through `begin_with_tenant`; a bare `.pool()` is legitimate only
        # on the RLS-exempt `tenants` table or a pre-auth path and must carry an
        # adjacent `// SAFETY (PMS-285` note. Fails loud if a new one appears
        # without that note.
        shell: nu {0}
        run: |
          nu scripts/check-pool-safety.nu

      - name: Rate-limit helper
        # PMS-773: `rate_limited_response` builds every 429 (body, Retry-After,
        # no-store). It was copied instead of called three times because it was
        # a private fn in a route file, and the fourth site agreed with none of
        # the copies. Fails loud if a route builds a 429 itself again, or if a
        # handler computes a retry delay and drops it.
        shell: nu {0}
        run: |
          nu scripts/check-rate-limit-helper.nu

      - name: Runner labels
        # PMS-719: a job that compiles on the runner must request the dev label
        # (the only image with cc/gcc/ld + OpenSSL headers); base is for
        # everything else. Fails loud if a compiling job drifts back to base or
        # if someone re-adds a run-time `zypper install gcc` workaround.
        shell: nu {0}
        run: |
          nu scripts/check-runner-labels.nu

      - name: OCI build cache
        # PMS-720 / GOV-20: the image build caches to the runner's built-in
        # Actions cache server (type=gha, mode=max). The retired inline and
        # registry :buildcache backends both still go green on a fresh run, so
        # a regression is invisible without this check.
        shell: nu {0}
        run: |
          nu scripts/check-oci-build-cache.nu

      - name: OCI publish tags
        # PMS-733: `:latest` publishes from main only; a feature branch publishes
        # its own tag and only if oci-build/get-tags.nu allow-lists it. The push
        # filter, the ref guard and the tag resolver must agree, and they drift
        # silently - a branch in the filter but not the resolver would resolve
        # `latest` and overwrite the tag production tracks.
        shell: nu {0}
        run: |
          nu scripts/check-oci-publish-tags.nu

      - name: Workspace dependency table
        # PMS-785: `[workspace.dependencies]` only reaches the build graph
        # through `{ workspace = true }`. An entry nobody inherits states a
        # version and a feature set the build never uses (`tower-http` pinned
        # two features there while the root package pinned six), and
        # `cargo machete` cannot see it - it reads each package's own tables.
        shell: nu {0}
        run: |
          nu scripts/check-workspace-deps.nu

      - name: Environment-variable parity
        # PMS-836: compose.dev.yml enumerates the dev container's environment,
        # so a variable the code reads with no line there cannot be set in dev
        # at all - the operator edits .env, gets no error, and the feature
        # stays off. That silently shipped SPA_BASE_URL, ABUSE_CONTACT_EMAIL,
        # PUBLIC_API_BASE_URL and TENANT_LOGO_MAX_BYTES unreachable.
        shell: nu {0}
        run: |
          nu scripts/check-env-example.nu

      - name: Documented just recipes
        # PMS-843: README.md and docs/quickstart.md are the first commands a
        # newcomer types. Several sites invoked a `dev-down` recipe for a stop
        # step named `down`, so every documented restart failed at its first
        # instruction. Fails loud when a doc names a recipe that does not exist.
        shell: nu {0}
        run: |
          nu scripts/check-doc-recipes.nu

      - name: Config doc paths
        # PMS-855: four comments in .env.example and compose.dev.yml pointed at
        # a docs/mokosh-smtp/ directory that has never existed in this repo.
        # .env.example is minted into .env in every clone, so the dead pointer
        # reached every developer configuring mail. Fails when a config comment
        # names a docs/ path that is not on disk.
        shell: nu {0}
        run: |
          nu scripts/check-config-doc-paths.nu

      - name: Unused dependencies
        # PMS-780: `pulldown-cmark` and `minijinja` were declared with no call
        # site and compiled on every cold build. The manifest is clean now, so
        # this gate is blocking rather than advisory: a dependency with no use
        # fails the PR instead of waiting for the next audit. `cargo install`
        # is a no-op when rust-cache restores the binary.
        run: |
          cargo install --locked cargo-machete
          cargo machete

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Compile check
        run: cargo check --all-targets

      - name: Unit tests
        run: cargo test --lib

      - name: Doc tests
        # Runs the doctests, including the PMS-139 `compile_fail` guard that
        # pins "a raw Uuid cannot be passed where a TenantId is required".
        # `--lib` above does not execute doctests.
        run: cargo test --doc
