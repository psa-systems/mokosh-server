---

# Postgres-backed integration gate: runs the full `tests/*.rs` suite against a
# real database. Split out of check.yml (PMS-267) so the fast fmt/clippy/compile
# gate is not blocked on a Postgres spin-up. Mirrored locally by
# `just test-integration`, which runs the unsharded profile (sharding is a CI
# scheduling concern).
#
# DEV-612: pull_request only. The `push: main` run landed after the merge, so it
# gated nothing, and re-ran a 440s suite against a tree the pull-request run had
# usually already tested.
#
# PMS-1252: `cache-warm.yml` archives the same `cargo nextest archive` on push
# to main so the shared build cache is populated for a later pull-request run
# to restore. The warm job archives and discards; it does not run tests, so
# the "same tree twice" trap DEV-612's deleted `check-single-build.nu` existed
# to catch does not fire for the warm run.
#
# PMS-1253: this file now has three jobs. `build` compiles the nextest archive
# ONCE under the full disk-headroom + cache + sampler shape; `test` is a
# fail-fast=false matrix of N shards that download the archive and run
# `--partition hash:k/N` under their own Postgres service; `summary` fails the
# workflow if any shard failed, which is the one job name branch protection
# needs to require. `hash:` keeps a test in the same shard across runs so a
# slow case stays attributable (`count:k/N` would reassign on every added test
# file, which makes per-shard timings incomparable across runs).
#
# PMS-1394: this file runs the SUPPORTED suites. The tests for functionality
# nothing currently uses run weekly in `integration-unsupported.yml` instead,
# because standing their dependencies up costs this job time on every pull
# request for coverage of a path no deployment takes. Which suites those are
# is NOT decided here. `.config/nextest.toml` carries the split as a
# `default-filter` on the `ci` profile, so this job names a profile and never
# a suite, and `just test-integration` selects the identical set without
# either of them repeating the expression.
#
# The binaries are still BUILT here. `cargo nextest archive` compiles every
# `tests/*.rs` target whatever the filter says, so a change that stops an
# unsupported suite compiling still fails the pull request; only its
# assertions moved.

name: Integration

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build nextest archive
    # Dev label: `cargo nextest archive` compiles natively on the runner, and
    # only the dev image ships the C toolchain + OpenSSL headers that needs
    # (PMS-705).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    # Placeholder (PMS-1253): the first three green sharded runs after this
    # lands will supply the measured wall times for `build`, each shard, and
    # the summary; replace each `timeout-minutes` with 1.5x the longest
    # observed value rounded up to 5 minutes, and record the measurements in
    # the per-job comment. The historical unsharded build step took 111-731s
    # (`7959c0e1`'s own data), so this bound covers the cold case with
    # headroom until the measured value lands.
    timeout-minutes: 25

    env:
      SQLX_OFFLINE: "true"
      RUST_BACKTRACE: 1

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Require disk headroom for the link step
        # PMS-740: the archive step links one debug binary per `tests/*.rs`
        # suite. When the runner filesystem fills mid-write, `rust-lld`
        # writes its output through an mmap and takes SIGBUS
        # (`collect2: fatal error: ld terminated with signal 7 [Bus
        # error]`), which has twice been triaged as a code defect it never
        # was (runs #3666, #3719). Failing here instead names the real
        # problem in one line, before 20 minutes of compilation reach a
        # confusing crash. 25G = roughly twice the peak this suite's link
        # stage has been observed to need.
        run: |
          suites=$(ls tests/*.rs | wc -l)
          avail_gb=$(df -P -BG . | awk 'NR==2 {gsub(/G/, "", $4); print $4}')
          echo "Integration suites to link: ${suites} debug test binaries"
          echo "Free space on the workspace filesystem: ${avail_gb}G"
          df -h .
          if [ "${avail_gb}" -lt 25 ]; then
            echo "::error::Runner has only ${avail_gb}G free; this suite needs ~25G to link its test binaries. This is a runner-capacity problem, not a problem with the commit under test. See PMS-740."
            exit 1
          fi

      - name: Cache Rust build
        # PMS-1252: `shared-key` MUST match `cache-warm.yml`'s
        # warm-integration job so a pull-request run restores what the
        # post-merge warm saved. The key lands in rust-cache's key
        # material as the `-integration-` segment.
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: integration
          cache-on-failure: true

      - name: Install cargo-nextest
        # PMS-1177: nextest schedules test CASES from every archived binary
        # concurrently instead of running one `tests/*.rs` binary to
        # completion before the next, which is where most of the previous
        # wall clock went.
        #
        # PMS-1251: a pinned release archive replaces `cargo install --locked
        # cargo-nextest`, which used to compile 717 `Compiling` lines on
        # every cache-miss run (333 of them nextest's own tree). The pair
        # here matches `cache-warm.yml`'s install step; bump both together
        # when upgrading nextest, otherwise the warm cache the pull-request
        # job restores was built against a different binary.
        env:
          NEXTEST_VERSION: "0.9.145"
          NEXTEST_SHA256: "32aa82416099eb12fffae9cf1a279ad201fecbd3f74826c613e32e9006b29867"
        run: |
          set -euo pipefail
          curl --silent --fail --location --output /tmp/nextest.tar.gz \
            "https://get.nexte.st/${NEXTEST_VERSION}/linux"
          echo "${NEXTEST_SHA256}  /tmp/nextest.tar.gz" | sha256sum --check --strict
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "${cargo_bin}"
          tar --extract --gzip --file /tmp/nextest.tar.gz --directory "${cargo_bin}"

      - name: Cap build parallelism
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Build the integration test archive
        # PMS-1177: `cargo nextest archive` compiles every `tests/*.rs`
        # binary plus the lib unit tests BEFORE the timed step, the same
        # reason PMS-1100 split the compile out of the timed step in the
        # first place. The archive is what each shard runs from with
        # `--archive-file`, which cannot recompile, so a dirty fingerprint
        # cannot make the test step start with a `Compiling mokosh-server`
        # line (PMS-1253 AC: "No shard log contains a `Compiling
        # mokosh-server` line").
        #
        # The sampler records free space every 5s for the life of the build
        # so a failure has evidence from DURING the link rather than from
        # after it, when the space has already been released and the
        # filesystem looks healthy. That gap is why the first two
        # occurrences could not be pinned down (PMS-740).
        run: |
          ( while :; do df -P -BM . | awk 'NR==2 {gsub(/M/, "", $4); print $4}'; sleep 5; done ) > /tmp/disk-samples-build.txt 2>/dev/null &
          sampler=$!
          started=$(date +%s)
          set +e
          cargo nextest archive --archive-file nextest-archive.tar.zst
          status=$?
          set -e
          kill "${sampler}" 2>/dev/null || true
          echo "Test binaries built in $(( $(date +%s) - started ))s"
          if [ -s /tmp/disk-samples-build.txt ]; then
            low=$(sort -n /tmp/disk-samples-build.txt | head -1)
            echo "Lowest free space seen during the build: ${low}M"
            if [ "${status}" -ne 0 ] && [ "${low}" -lt 5000 ]; then
              echo "::error::The build failed with under 5G free at its lowest point, which is the PMS-740 disk-exhaustion signature. Check the linker errors above for 'signal 7 [Bus error]' before treating this as a code failure."
            fi
          fi
          exit "${status}"

      - name: Upload the nextest archive
        # Each shard downloads this with `forgejo/download-artifact@v4` and
        # runs it with `--archive-file`, so no shard recompiles the test
        # binaries. `retention-days: 1` is enough: the artifact is useful
        # only to the matrix shards that `needs: build` on this job.
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1
          if-no-files-found: error

  test:
    name: integration tests (shard ${{ matrix.shard }}/3)
    needs: build
    # Dev label: the shard runs `cargo nextest run` against the archive, so
    # the dev image's C toolchain and OpenSSL headers are available even
    # though no compile happens here (PMS-705). A fallback compile from a
    # dirty fingerprint would otherwise hit `linker cc not found` on the
    # base image.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    # Placeholder (PMS-1253): see the `build` job's comment. Historical
    # unsharded test step took 508-938s on the fast runner, 701s on the slow
    # one; the 8-CPU runner timed out at 30m before the archive step split
    # (`#6274`). At N=3 each shard runs ~1/3 of the cases on an independent
    # Postgres, so this bound is a cautious cold-start cover until the first
    # three sharded runs supply the real number.
    timeout-minutes: 20

    strategy:
      # Every shard still runs after one fails, so a slow case does not hide
      # a different one in a different shard. The summary job folds the
      # outcomes.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        # Each shard runs on its own runner, so each gets its own `postgres`
        # service. The template every case clones (PMS-1254) is built once
        # per shard inside the suite's own advisory lock, idempotent across
        # the three shards and across runs.
        image: postgres:18.2-alpine3.23
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      # Job-level rather than step-level (PMS-1177): the template-build step
      # and the test step must see the identical environment, otherwise a
      # dirty cargo fingerprint makes the test step recompile the binaries
      # the archive built - which the archive flow forbids.
      RUST_BACKTRACE: 1

    steps:
      - name: Clone the repository
        # scripts/test-db-roles.sql and nextest's own config files are read
        # from the workspace, so each shard still clones the repo even
        # though the test binaries come from the archive artifact.
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Download the nextest archive
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: nextest-archive
          path: .

      - name: Install cargo-nextest
        # The archive contents are version-pinned; the harness that runs
        # them is pinned to the matching nextest release the `build` job
        # was linked against, same pair as `cache-warm.yml`.
        env:
          NEXTEST_VERSION: "0.9.145"
          NEXTEST_SHA256: "32aa82416099eb12fffae9cf1a279ad201fecbd3f74826c613e32e9006b29867"
        run: |
          set -euo pipefail
          curl --silent --fail --location --output /tmp/nextest.tar.gz \
            "https://get.nexte.st/${NEXTEST_VERSION}/linux"
          echo "${NEXTEST_SHA256}  /tmp/nextest.tar.gz" | sha256sum --check --strict
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "${cargo_bin}"
          tar --extract --gzip --file /tmp/nextest.tar.gz --directory "${cargo_bin}"

      - name: Disable Postgres durability
        # PMS-1251: this `postgres` service is thrown away with the job, so
        # fsync/synchronous_commit/full_page_writes buy crash safety this
        # database never needs to survive into. Measured locally against
        # postgres:18.2-alpine3.23 on 2026-09-17: the 229-migration run drops
        # from 1.12-1.32s to 0.60-0.71s and `CREATE DATABASE ... TEMPLATE`
        # from 104-146ms to 35-39ms. Each shard pays this once and recovers
        # it on every clone.
        run: |
          psql "${DATABASE_URL}" --set=ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET synchronous_commit = off;
          ALTER SYSTEM SET full_page_writes = off;
          SELECT pg_reload_conf();
          SQL
          psql "${DATABASE_URL}" --set=ON_ERROR_STOP=1 --command 'SHOW fsync'

      - name: Create the DB roles the migrations grant to
        # PMS-988: migration 207 ends with `GRANT ... TO mokosh_app`.
        # Postgres rejects a GRANT to a role that does not exist (42704),
        # so every test fails at migration 207 before its body runs. A real
        # deployment never reaches that: `provision_roles` creates the
        # split roles at startup; this job has no server startup, so the
        # step preparing the cluster creates the role. Each shard's own
        # Postgres service repeats this.
        run: psql "${DATABASE_URL}" --set=ON_ERROR_STOP=1 --file scripts/test-db-roles.sql

      - name: Build the template every test clones
        # PMS-1254: the 243 migrations are applied ONCE per Postgres
        # service, into a template database named after a digest of the
        # migration set, and each case is a `CREATE DATABASE ... TEMPLATE`
        # clone of it. Done here in a step of the shard rather than inside
        # whichever case arrived first with every other case waiting on the
        # lock, so the "built the template" line is printed where a reader
        # can see it. Run out of the archive so this compiles nothing.
        run: |
          cargo nextest run --archive-file nextest-archive.tar.zst --profile ci \
            --no-capture -E 'binary(template_database)'

      - name: Integration tests (shard ${{ matrix.shard }}/3)
        # PMS-1253: `--partition hash:k/N` keeps every test in the same
        # shard across runs so a slow case stays attributable; `count:k/N`
        # would reassign on every added test file. nextest's `fail-fast =
        # false` (`.config/nextest.toml`, PMS-1031) is why every case still
        # runs here even after one fails. The archive, downloaded above,
        # cannot recompile; a `Compiling mokosh-server` line in this step's
        # log would mean a dirty fingerprint and would fail the PMS-1253
        # AC that forbids it.
        #
        # There is no shell `timeout` wrapper here (PMS-823, PMS-1177):
        # nextest's `slow-timeout`/`terminate-after` in the `ci` profile
        # reports and terminates a stuck case BY NAME, so there is no
        # grep-based diagnostic to get wrong and no separate hang message
        # to keep in sync with the harness's own report.
        run: |
          started=$(date +%s)
          set +e
          cargo nextest run --archive-file nextest-archive.tar.zst --profile ci \
            --partition hash:${{ matrix.shard }}/3
          status=$?
          set -e
          echo "Shard ${{ matrix.shard }}/3 test run took $(( $(date +%s) - started ))s"
          exit "${status}"

  summary:
    name: integration tests
    # Always runs so a cancelled or failed shard still produces the one
    # name branch protection reads. `needs: test` makes it wait on every
    # shard; `if: always()` makes it fire whether they passed or not.
    needs: test
    if: always()
    # Dev label: this job only reads shard outcomes and never compiles,
    # so the dev image's C toolchain is strictly unneeded. The runner
    # label stays uniform across this file for the file-wide
    # `check-runner-labels` guard that reads any `cargo ` line anywhere
    # as a requirement for every job's label (PMS-705).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}
    timeout-minutes: 5

    steps:
      - name: Fail if any shard failed
        # Reads the matrix job's aggregate result; `success` is the only
        # value that lets the summary pass. A cancelled or skipped shard
        # fails the workflow, same as the single-job gate did.
        run: |
          result="${{ needs.test.result }}"
          echo "test matrix result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::integration test matrix did not succeed (result=${result})"
            exit 1
          fi
