---

# Postgres-backed integration gate: runs the full `tests/*.rs` suite against a
# real database. Split out of check.yml (PMS-267) so the fast fmt/clippy/compile
# gate is not blocked on a Postgres spin-up. Mirrored locally by
# `just test-integration`.
#
# DEV-612: pull_request only. The `push: main` run landed after the merge, so it
# gated nothing, and re-ran a 440s suite against a tree the pull-request run had
# usually already tested. scripts/check-single-build.nu fails if it comes back.
name: Integration

on:
  pull_request:
    branches:
      - main

jobs:
  integration:
    name: integration tests
    # Dev label: `cargo test --tests` compiles natively on the runner, and only
    # the dev image ships the C toolchain + OpenSSL headers that needs. Base
    # fails at `linker cc not found` (PMS-706, same cause as check.yml).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    # Outer backstop (PMS-823). The inner `timeout` around the test run is
    # what produces a diagnostic; this only stops a wedge elsewhere in the
    # job (the compile step included, PMS-1100) from running until the
    # runner's own limit. It has to clear the worst measured build (584s on a
    # missed rust-cache) plus the whole inner budget plus checkout and cache
    # upload, or it fires first and the inner diagnostic never prints.
    timeout-minutes: 70

    # Postgres service for `cargo test --tests`. `#[sqlx::test]` creates a
    # fresh database per invocation against the URL in DATABASE_URL, so
    # this single instance fans out to all integration tests.
    #
    # The Forgejo Actions runner puts the job container and its service
    # containers on a shared bridge network; services are reachable from
    # the job container by their service name on the container-internal
    # port. localhost would resolve to the job container itself, where
    # nothing is listening on 5432.
    services:
      postgres:
        image: postgres:18.2-alpine3.23
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Require disk headroom for the link step
        # Runs BEFORE the cache restore on purpose: a runner too full to link
        # is also too full to usefully restore a multi-GB cargo cache, so
        # failing first saves that download and leaves less on disk for
        # whatever runs next.
        # PMS-740. `cargo test --tests` links one debug binary per `tests/*.rs`
        # suite, each several hundred MB, several concurrently under
        # CARGO_BUILD_JOBS.
        # When the runner filesystem fills mid-write, `rust-lld` writes its
        # output through an mmap and takes SIGBUS, which surfaces as:
        #
        #   collect2: fatal error: ld terminated with signal 7 [Bus error]
        #
        # That reads as a toolchain crash and has twice been triaged as a
        # code defect it never was (runs #3666 and #3719). Failing here
        # instead names the real problem in one line, before 20 minutes of
        # compilation is spent to reach a confusing crash.
        #
        # 25G is chosen as roughly twice the peak this suite's link stage has
        # been observed to need. Raise it if the suite grows rather than
        # lowering it after a near miss. How much the suite has grown is
        # counted at run time and printed below rather than written into this
        # comment: the hand-maintained literal that used to sit here read 22
        # while the tree held 81 (PMS-858).
        run: |
          suites=$(ls tests/*.rs | wc -l)
          avail_gb=$(df -P -BG . | awk 'NR==2 {gsub(/G/, "", $4); print $4}')
          echo "Integration suites to link: ${suites} debug test binaries"
          echo "Free space on the workspace filesystem: ${avail_gb}G"
          df -h .
          if [ "${avail_gb}" -lt 25 ]; then
            echo "::error::Runner has only ${avail_gb}G free; this suite needs ~25G to link its test binaries. This is a runner-capacity problem, not a problem with the commit under test. See PMS-740."
            exit 1
          fi

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see "Concurrency
        # cap" in CI.md of dev.a8n.run/niceguyit/governance; not a file in
        # this repository).
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"


      - name: Start MinIO for the S3 storage suite
        # PMS-958. `tests/s3_storage.rs` round-trips the S3 backend against a
        # real object store and skips (loudly) when S3_ENDPOINT is unset, so
        # this step is what makes it run here. A `services:` entry cannot do
        # it: the MinIO image carries no command, `server /data` has to be
        # passed, and Forgejo (like GitHub) service containers have no
        # `command` key and `--entrypoint` takes a binary without arguments.
        # So the pinned release binary runs in the job.
        #
        # The binary comes OUT OF THE IMAGE rather than from a download.
        # MinIO archived the open-source server, and dl.min.io now answers 410
        # Gone for every community release and hotfix, the pinned one included
        # ("These files are no longer served from this site"), which broke this
        # job on every branch at once. The GitHub release assets are gone too.
        # The container image is still published, and it is the same artefact:
        # the binary extracted below hashes to exactly the MINIO_SHA256 the
        # withdrawn URL used to serve, which is why that line is unchanged.
        #
        # Pinned by IMAGE DIGEST, not by tag, so a re-push under the same tag
        # cannot change what runs here; the checksum stays as the second belt.
        # `docker create` + `docker cp` rather than `docker run`, because the
        # job container and a sibling container are not on the same network by
        # default, and taking the binary out keeps the health check on
        # 127.0.0.1 where the rest of this step already expects it. Jobs reach
        # the runner's daemon (`container.docker_host: "-"`), which is the same
        # access `build-oci-image.yml` uses.
        #
        # `compose.dev.yml` already runs this image for `just dev-s3`, so dev
        # and CI now take MinIO from one place. Bump the digest and the
        # checksum together, and the compose tag with them.
        #
        # Only this suite sets STORAGE_BACKEND=s3, in its own process; the
        # variables below are read by nothing else, so every other suite
        # keeps exercising the local backend.
        env:
          MINIO_IMAGE: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          MINIO_SHA256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::MinIO pin is for linux-amd64; runner is $(uname -m)"
            exit 1
          fi
          docker pull --quiet "${MINIO_IMAGE}"
          container="$(docker create "${MINIO_IMAGE}")"
          # Removed even when the copy fails, or a retried job leaks a
          # container per attempt onto the shared runner daemon.
          trap 'docker rm --volumes "${container}" > /dev/null 2>&1 || true' EXIT
          docker cp "${container}":/usr/bin/minio /tmp/minio
          echo "${MINIO_SHA256}  /tmp/minio" | sha256sum --check --strict
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=mokosh MINIO_ROOT_PASSWORD=mokosh-ci-password \
            nohup /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 \
            > /tmp/minio.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9000/minio/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:9000/minio/health/live > /dev/null || {
            echo "::error::MinIO did not become healthy; log follows"
            cat /tmp/minio.log
            exit 1
          }
          {
            echo "S3_ENDPOINT=http://127.0.0.1:9000"
            echo "S3_BUCKET=mokosh-ci"
            echo "S3_REGION=us-east-1"
            echo "S3_PATH_STYLE=true"
            echo "S3_ACCESS_KEY_ID=mokosh"
            echo "S3_SECRET_ACCESS_KEY=mokosh-ci-password"
          } >> "$GITHUB_ENV"

      - name: Create the DB roles the migrations grant to
        # PMS-988: migration 207 (`app_secrets`) ends with `GRANT ... TO
        # mokosh_app`, and Postgres rejects a GRANT to a role that does not
        # exist (42704), so every `#[sqlx::test]` in the suite failed at
        # migration 207 before its body ran. A real deployment never reaches
        # that: `provision_roles` creates the split roles at startup, before
        # the migrations run. This job has no server startup, so the step that
        # prepares the cluster creates the role instead. The statement lives in
        # a file because `just ensure-test-db-roles` runs the same one against
        # the dev cluster; scripts/test-db-roles.sql says why only the name is
        # reproduced.
        #
        # ON_ERROR_STOP is not optional: psql exits 0 on a failed statement
        # without it, which would put the failure back where it was, in the
        # test output rather than here.
        run: psql "${DATABASE_URL}" --set=ON_ERROR_STOP=1 --file scripts/test-db-roles.sql

      - name: Build the integration test binaries
        # PMS-1100: compile every `tests/*.rs` binary BEFORE the timed step,
        # under only the job's outer budget. The 25 minute `timeout` below
        # used to wrap `cargo test --tests`, which compiles first, so on a
        # cold or missed rust-cache the build ate most of the budget and the
        # step died at the second suite reporting a "test hang" that never
        # happened (three runs on 2026-09-06 alone). The same command with
        # `--no-run` leaves the binaries in the target dir the next step
        # reuses, so the timer measures the tests and nothing else.
        #
        # The sampler records free space every 5s for the life of the build so
        # a failure has evidence from DURING the link rather than from after
        # it, when the space has already been released and the filesystem
        # looks healthy. That gap is why the first two occurrences could not
        # be pinned down (PMS-740). It lives here because the link is here.
        run: |
          ( while :; do df -P -BM . | awk 'NR==2 {gsub(/M/, "", $4); print $4}'; sleep 5; done ) > /tmp/disk-samples-build.txt 2>/dev/null &
          sampler=$!
          started=$(date +%s)
          set +e
          cargo test --tests --no-run
          status=$?
          set -e
          kill "${sampler}" 2>/dev/null || true
          echo "Test binaries built in $(( $(date +%s) - started ))s"
          if [ -s /tmp/disk-samples-build.txt ]; then
            low=$(sort -n /tmp/disk-samples-build.txt | head -1)
            echo "Lowest free space seen during the build: ${low}M"
            if [ "${status}" -ne 0 ] && [ "${low}" -lt 5000 ]; then
              echo "::error::The build failed with under 5G free at its lowest point, which is the PMS-740 disk-exhaustion signature. Check the linker errors above for 'signal 7 [Bus error]' before treating this as a code failure."
            fi
          fi
          exit "${status}"

      - name: Integration tests
        # cargo test --tests runs every integration suite (all `tests/*.rs`
        # binaries) plus the lib unit tests, so new suites are picked up
        # automatically instead of via a hand-maintained --test allowlist,
        # which at the time it was removed silently dropped 13 of the 22
        # suites that then existed. That count is history, not a description
        # of the tree; the suite count is printed by the disk-headroom step.
        # The binaries were built by the step above; this invocation finds
        # them fresh and only runs them (PMS-1100).
        #
        # --test-threads=4 caps in-flight `#[sqlx::test]` cases per binary.
        # Each test creates a per-test database AND holds the sqlx-test
        # maintenance pool; at default per-cpu parallelism on a 16-core
        # runner the maintenance pool was timing out with PoolTimedOut on
        # tests/auth.rs (14 tests). 4 in-flight is well within the
        # postgres default max_connections (100); slight wall-clock cost,
        # full reliability.
        #
        # --no-fail-fast (PMS-1031): without it `cargo test --tests` stops at the
        # first failing binary, so one broken suite reports as "everything
        # that sorts after it did not run" and 40 non-portal failures on main
        # were invisible even to someone looking at the area. With it every
        # binary runs and the summary names each red one; the step still fails.
        #
        # The inner `timeout` bounds the harness itself (PMS-823). Run #4017
        # wedged mid-suite, so `status=$?` never ran and none of the reporting
        # below it did either; the log just stopped. SIGQUIT gives the Rust
        # process a chance to dump state before --kill-after escalates to
        # SIGKILL.
        #
        # The budget is 40m because the suite has outgrown the 25m it was
        # given. That number was chosen when a healthy run reached its last
        # suite about four minutes in; the tree now holds 167 test binaries
        # and a healthy run takes 1036s (17m), so 25m was 1.45x the healthy
        # time, not "several times" it. Two runs on the same tree, one hour
        # apart, measured the gap that closes: every suite in the slower one
        # ran 1.38x longer than in the faster one (871s of common suites
        # against 1205s), with no test over the harness's own 60s report
        # threshold, so the whole run is uniformly slower when the runner is
        # shared and nothing is hanging. 1.45x headroom does not survive a
        # 1.38x slowdown, which is how run #5568 was killed at 1501s with 152
        # of 167 suites done. 40m is 2.3x the healthy time, so a genuine hang
        # still fires it.
        env:
          RUST_BACKTRACE: 1
        run: |
          started=$(date +%s)
          set +e
          timeout --signal=QUIT --kill-after=30s 40m \
            cargo test --tests --no-fail-fast -- --test-threads=4 2>&1 \
            | tee /tmp/integration-tests.log
          status=${PIPESTATUS[0]}
          set -e
          echo "Test run took $(( $(date +%s) - started ))s"
          # 124 = SIGQUIT ended it, 137 = it ignored SIGQUIT and --kill-after
          # escalated. Both mean the bound fired, not an assertion failure.
          #
          # Which of the two things it means is read out of the log rather than
          # asserted. The harness prints "has been running for over 60 seconds"
          # for a case that is actually stuck; with no such line the run was
          # not hung, it was uniformly slow, and calling that a hang sends the
          # reader hunting for a blocking test that does not exist (it did,
          # on run #5568).
          if [ "${status}" -eq 124 ] || [ "${status}" -eq 137 ]; then
            if grep -q 'has been running for over' /tmp/integration-tests.log; then
              echo "::error::The test run did not finish within 40m and was killed (exit ${status}). The harness reported at least one case running over 60 seconds, so this is the PMS-823 hang signature: the last such line above names the blocking case."
            else
              echo "::error::The test run did not finish within 40m and was killed (exit ${status}), and NO case was reported running over 60 seconds, so nothing hung: the whole run was slower than the budget. A healthy run is about 17m; a shared runner has been measured making every suite 1.38x slower. Check whether other jobs shared this runner before treating it as a code failure."
            fi
          fi
          exit "${status}"
