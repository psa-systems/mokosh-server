---

# Build OCI image and push to Forgejo Container Registry.
name: Build OCI container


on:
  push:
    branches:
      - "main"
      # Allow-listed feature branches publish their own branch tag and never
      # :latest, so staging can run a branch (PMS-733). Keep this list in sync
      # with BRANCH_ALLOW_LIST in oci-build/get-tags.nu; scripts/check-oci-publish-tags.nu
      # fails the build if the two disagree.
      - "mokosh-client-login"
    tags:
      - "v*"
    paths:
      - "src/**"
      # Workspace crates also produce compiled output; without this
      # glob, edits limited to e.g. crates/mokosh-types/src/...
      # never re-publish :latest.
      - "crates/**"
      - "migrations/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "oci-build/**"
      - ".forgejo/workflows/build-oci-image.yml"
  # Manual trigger so we can force a fresh :latest publish without
  # waiting for a code change that happens to hit the path filter.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, compute tags and print every registry action without pushing"
        type: boolean
        default: true
      simulate_tag:
        description: "Version like v9.9.9 to exercise the release publish path; empty exercises latest"
        type: string
        default: ""

jobs:
  build-and-push:
    name: Build and push mokosh-server image
    # Only main and version tags publish the production image. workflow_dispatch
    # from a feature branch must not overwrite :latest, so gate the job on the
    # ref in addition to the push-trigger branch filter above. The allow-listed
    # branches appended to it publish their own branch tag only; the mode
    # computation below never resolves `latest` off main (PMS-733).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/mokosh-client-login'
    # Base label: the musl compile happens inside `docker buildx`, so the runner
    # only needs docker, nu and git. Nothing compiles natively here.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ""
      REGISTRY_PROVIDER: dev.a8n.run
      REGISTRY_OWNER: ${{ vars.PSA_SYSTEMS_PRIVATE_PACKAGE_OWNER }}
      REGISTRY_USER: ""
      REGISTRY_PASSWORD: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Set environment variables
        shell: nu {0}
        run: |
          let owner = $env.REGISTRY_OWNER
          $"REGISTRY_USER=($owner)\n" | save --append $env.GITHUB_ENV
          $"IMAGE_REGISTRY=($env.REGISTRY_PROVIDER)/($owner)\n" | save --append $env.GITHUB_ENV

      - name: Resolve publish mode, train and tag
        id: resolve
        shell: nu {0}
        run: |
          # Derive the publish mode from the trigger, never from git describe:
          # a tag ref -> release (push :vX.Y.Z only), a main push -> latest
          # (push :latest only), an allow-listed branch push -> branch (push
          # that branch's tag only), a manual run -> dry-run. A release commit
          # fires BOTH the main-push and the tag-push events; resolving disjoint
          # tags per trigger is what stops the two runs from racing to overwrite
          # the same :latest tag (governance GOV-13).
          let event = "${{ github.event_name }}"
          let ref_type = "${{ github.ref_type }}"
          let ref_name = "${{ github.ref_name }}"
          let simulate_tag = "${{ inputs.simulate_tag }}"
          let mode = if $event == "workflow_dispatch" {
            "dry-run"
          } else if $ref_type == "tag" {
            "release"
          } else if $ref_name == "main" {
            "latest"
          } else {
            # get-tags.nu rejects a branch that is not on its allow-list, so an
            # unlisted ref that somehow reaches this job fails loud instead of
            # falling through to :latest.
            "branch"
          }
          # A manual run only mutates the registry if dry_run is explicitly false;
          # the input defaults to true, and push events always publish for real.
          let dry_run = ($event == "workflow_dispatch" and "${{ inputs.dry_run }}" != "false")
          let r = (^nu oci-build/get-tags.nu --mode $mode --ref-name $ref_name --simulate-tag $simulate_tag --json | from json)
          $"mode=($r.mode)\n" | save --append $env.GITHUB_OUTPUT
          $"train=($r.train)\n" | save --append $env.GITHUB_OUTPUT
          $"tag=($r.tag)\n" | save --append $env.GITHUB_OUTPUT
          $"describe=($r.describe)\n" | save --append $env.GITHUB_OUTPUT
          $"dry_run=($dry_run)\n" | save --append $env.GITHUB_OUTPUT
          print $"mode=($r.mode) train=($r.train) tag=($r.tag) describe=($r.describe) dry_run=($dry_run)"

      # Resolve the version metadata that build.rs expects on its env. The
      # .git tree is not copied into the Docker build context (see
      # oci-build/Dockerfile), so without these args build.rs falls back to
      # "unknown" / "v<crate-version>" and the deployed image cannot be
      # identified per commit - the E2E deploy-sync gate ends up polling for
      # a hash that never appears (PMS-140).
      - name: Resolve build metadata
        shell: nu {0}
        run: |
          let git_hash = (^git rev-parse --short=12 HEAD | str trim)
          let git_describe = (^git describe --tags --always --dirty | str trim)
          let source_date_epoch = (^git log -1 --pretty=%ct HEAD | str trim)
          let build_date = (^date --utc --iso-8601=seconds | str trim)
          $"MOKOSH_GIT_HASH=($git_hash)\n" | save --append $env.GITHUB_ENV
          $"MOKOSH_GIT_DESCRIBE=($git_describe)\n" | save --append $env.GITHUB_ENV
          $"MOKOSH_BUILD_DATE=($build_date)\n" | save --append $env.GITHUB_ENV
          $"SOURCE_DATE_EPOCH=($source_date_epoch)\n" | save --append $env.GITHUB_ENV
          print $"git_hash=($git_hash) git_describe=($git_describe) build_date=($build_date)"

      - name: Set up buildx builder
        # The `docker-container` driver is required for any cache export;
        # the default `docker` driver only carries inline metadata, which
        # misses the dependency-build layer ("OCI build workflow" in CI.md of
        # dev.a8n.run/niceguyit/governance, GOV-20; not a file in this
        # repository).
        run: docker buildx create --name container-builder --driver docker-container --use

      - name: Export Actions runtime env for buildx gha cache
        # A raw `docker buildx build` (unlike docker/build-push-action) does
        # not auto-inject the gha cache backend's env, and ACTIONS_RUNTIME_TOKEN
        # is masked from run: steps. This action re-exports ACTIONS_CACHE_URL /
        # ACTIONS_RUNTIME_TOKEN into GITHUB_ENV so the build step's `type=gha`
        # cache can reach act_runner's cache server (needs runner cache.enabled).
        uses: https://github.com/crazy-max/ghaction-github-runtime@v3

      - name: Log in to container registry
        shell: nu {0}
        run: |
          ^docker login --username $env.REGISTRY_USER --password $env.REGISTRY_PASSWORD $env.REGISTRY_PROVIDER

      - name: Build and push mokosh-server image
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let image = "mokosh-server"
          let registry = $env.IMAGE_REGISTRY
          let tag_args = [-t $"($registry)/($image):($tag)"]
          # Cache to the runner's built-in Actions cache server (type=gha),
          # keyed by ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN from the
          # runtime-env step above. type=registry round-tripped ~1.7 GiB over
          # the WAN every build and 499'd on slow-upload runners; type=gha
          # talks to act_runner's on-LAN cache server instead (governance GOV-20).
          let cache_from = "type=gha"
          # mode=max keeps the dependency-build layer; ignore-error keeps a
          # cache hiccup (or a disabled runner cache) from failing the build.
          let cache_to = "type=gha,mode=max,ignore-error=true"
          # A dry-run builds locally and pushes nothing (no cache export either,
          # so a simulated run never mutates the shared cache).
          let push_args = if $dry_run { [--load] } else { [--push --cache-to $cache_to] }
          let action = if $dry_run { "[dry-run] WOULD build and push" } else { "Building and pushing" }
          print $"($action) ($image) with tag: ($tag)"
          # The unused GIT_SHA build-arg the previous step passed was a no-op:
          # the Dockerfile reads MOKOSH_GIT_HASH / MOKOSH_GIT_DESCRIBE /
          # MOKOSH_BUILD_DATE / SOURCE_DATE_EPOCH, which build.rs exports as
          # rustc env vars (src/version.rs:21).
          let build_args = [
            "--build-arg" $"MOKOSH_GIT_HASH=($env.MOKOSH_GIT_HASH)"
            "--build-arg" $"MOKOSH_GIT_DESCRIBE=($env.MOKOSH_GIT_DESCRIBE)"
            "--build-arg" $"MOKOSH_BUILD_DATE=($env.MOKOSH_BUILD_DATE)"
            "--build-arg" $"SOURCE_DATE_EPOCH=($env.SOURCE_DATE_EPOCH)"
          ]
          ^docker buildx build ...$push_args --cache-from $cache_from ...$build_args ...$tag_args -f oci-build/Dockerfile .

      - name: Print image URLs
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let prefix = if $dry_run { "[dry-run] WOULD push image to" } else { "Image pushed to" }
          let image = "mokosh-server"
          let registry = $env.IMAGE_REGISTRY
          print $"($prefix) ($registry)/($image):($tag)"
