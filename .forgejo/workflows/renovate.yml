---

# Caller for the reusable Renovate workflow in common. The standard for this file is in common's README.md, "Consumer setup".

name: Renovate

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate (caller)
    uses: psa-systems/common/.forgejo/workflows/renovate-reusable.yml@f466fa87127d4c5d78e9b8d5a730bfc59ef45450  # main
    with:
      target_repository: ${{ github.repository }}
    secrets:
      RENOVATE_CI_TOKEN: ${{ secrets.RENOVATE_CI_TOKEN }}
      PUBLIC_GITHUB_REPO_TOKEN: ${{ secrets.PUBLIC_GITHUB_REPO_TOKEN }}
      PSA_SYSTEMS_PRIVATE_PACKAGE_PAT: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}
      A8N_TOOLS_PRIVATE_PACKAGE_PAT: ${{ secrets.A8N_TOOLS_PRIVATE_PACKAGE_PAT }}
      FORGEJO_PAT: ${{ secrets.FORGEJO_PAT }}
