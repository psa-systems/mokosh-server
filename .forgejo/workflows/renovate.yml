---

# Caller for the reusable Renovate workflow in common. The standard for this file is in common's README.md, "Consumer setup".

name: Renovate

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate (caller)
    uses: psa-systems/common/.forgejo/workflows/renovate-reusable.yml@5213b60641e19912747467e02bf630c9596bf790  # main
    with:
      target_repository: ${{ github.repository }}
    secrets:
      RENOVATE_CI_TOKEN: ${{ secrets.RENOVATE_CI_TOKEN }}
      PUBLIC_GITHUB_REPO_TOKEN: ${{ secrets.PUBLIC_GITHUB_REPO_TOKEN }}
      PSA_SYSTEMS_PRIVATE_PACKAGE_PAT: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}
