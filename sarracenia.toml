# Publishes mokosh-server's user-facing docs to docs.a8n.systems/docs/mokosh-server.
# Everything under docs/public/ is the published site; nothing outside it is.
# docs/ outside public/ (invariants/, dev-docs/, specification.md, ROADMAP.md,
# architecture.md, providers.md, etc.) is internal engineering material and
# is NOT published.
source = "mokosh-server"
base_path = "/docs/mokosh-server"
title = "Mokosh server"
include = ["docs/public/**/*.md"]
exclude = []

[storefront]
url = "https://docs.a8n.systems"
site = "docs"
