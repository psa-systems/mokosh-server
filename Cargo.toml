[workspace]
resolver = "2"
members = [
    ".",
    "crates/mokosh-auth-core",
    "crates/mokosh-auth-crypto",
    "crates/mokosh-auth-storage",
    "crates/mokosh-auth-oidc",
    "crates/mokosh-auth-federation",
    "crates/mokosh-auth-http",
    "crates/mokosh-auth",
    # main added this crate for the Google OAuth popup flow.
    "crates/google-oauth-flow",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
authors = ["Mokosh Server Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate", "ipnetwork"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-private", "typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.9"
rand_core = "0.6"
base64 = "0.22"
url = { version = "2", features = ["serde"] }
governor = "0.8"
moka = { version = "0.12", features = ["future"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
constant_time_eq = "0.3"
anyhow = "1"
ipnetwork = "0.20"
bytes = "1"
# `pool` is NOT a lettre default; opt in so LettreMailer reuses TCP
# connections across sends. `native-tls` over rustls because some SMTP
# relays' cert chains historically failed verification under rustls.
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "builder", "smtp-transport", "pool"] }

[package]
name = "mokosh-server"
version = "0.1.0"
edition = "2021"
authors = ["Mokosh Server Team"]
description = "Professional Services Automation platform for MSPs - API server"
license = "Proprietary"
repository = "https://github.com/your-org/mokosh-server"

[[bin]]
name = "mokosh-server"
path = "src/main.rs"

[[bin]]
name = "mokosh-bootstrap"
path = "src/bin/mokosh-bootstrap.rs"

[features]
default = ["multi-tenant", "server"]
multi-tenant = []
single-tenant = []
server = []

[lib]
name = "mokosh_server"
path = "src/lib.rs"

[dependencies]
# SSO / OIDC subsystem (workspace-internal, replaces legacy HS256 auth)
mokosh-auth = { path = "crates/mokosh-auth" }
# TOTP primitives (RFC 6238) live in the auth-crypto workspace member.
# Reused here so the legacy HS256 auth flow can verify TOTP codes
# without pulling in a redundant external crate.
mokosh-auth-crypto = { path = "crates/mokosh-auth-crypto" }

# Axum HTTP server
axum = { version = "0.8.3", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit", "request-id"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Password hashing
argon2 = "0.5"

# JWT tokens
jsonwebtoken = "9"

# Validation
validator = { version = "0.19", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment
dotenvy = "0.15"

# Email. Lettre powers the host-crate `Mailer` (utils/email.rs); the
# SSO subsystem keeps its own LettreMailer in crates/mokosh-auth-http.
lettre = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }

# HTTP client (for integrations)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2"

# Encryption + HMAC (RMM alert ingest signs bodies with HMAC-SHA256;
# PMS-104.)
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.9"
hmac = "0.12"
sha2 = "0.10"
constant_time_eq = "0.3"

# Rate limiting
governor = "0.8"

# Caching
moka = { version = "0.12", features = ["future"] }

# Decimal
rust_decimal = { version = "1", features = ["db-postgres", "serde"] }

# Markdown
pulldown-cmark = "0.12"

# Templates
minijinja = "2"

# Regex
regex = "1"

# Cron
cron = "0.15"

# URL
url = "2"

# Cookies (for the Google OAuth state cookie)
cookie = "0.18"

# Reusable Google OAuth helper (workspace member)
google-oauth-flow = { path = "crates/google-oauth-flow" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
