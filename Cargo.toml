[workspace]
resolver = "2"
members = [
    ".",
    # main added this crate for the Google OAuth popup flow.
    "crates/google-oauth-flow",
    # Shared DTOs between mokosh-server and mokosh-clients (PMS-129).
    "crates/mokosh-types",
    # Shared build-script logic for the root build.rs and google-oauth-flow (PMS-198).
    "crates/build-metadata",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
authors = ["Mokosh Server Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate", "ipnetwork"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-private", "typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.9"
rand_core = "0.6"
base64 = "0.22"
url = { version = "2", features = ["serde"] }
governor = "0.8"
moka = { version = "0.12", features = ["future"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
constant_time_eq = "0.3"
anyhow = "1"
ipnetwork = "0.20"
bytes = "1"
# `pool` is NOT a lettre default; opt in so LettreMailer reuses TCP
# connections across sends. `native-tls` over rustls because some SMTP
# relays' cert chains historically failed verification under rustls.
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "builder", "smtp-transport", "pool"] }

[package]
name = "mokosh-server"
version = "0.9.0"
edition = "2021"
authors = ["Mokosh Server Team"]
description = "Professional Services Automation platform for MSPs - API server"
license = "Proprietary"
repository = "https://dev.a8n.run/psa-systems/mokosh-server"

[[bin]]
name = "mokosh-server"
path = "src/main.rs"

[[bin]]
name = "mokosh-bootstrap"
path = "src/bin/mokosh-bootstrap.rs"

[features]
default = ["multi-tenant", "server"]
multi-tenant = []
server = []

[lib]
name = "mokosh_server"
path = "src/lib.rs"

[dependencies]
# Axum HTTP server
axum = { version = "0.8.3", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit", "request-id"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }
# IANA timezone database for chrono (business-hours-aware SLA clock,
# PMS-106). 0.9 tracks chrono 0.4.
chrono-tz = "0.9"

# Password hashing
argon2 = "0.5"

# JWT tokens
jsonwebtoken = "9"

# Validation
validator = { version = "0.19", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment
dotenvy = "0.15"

# Email. Lettre powers the host-crate `Mailer` (utils/email.rs).
lettre = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }

# HTTP client (for integrations)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2"

# Encryption + HMAC (RMM alert ingest signs bodies with HMAC-SHA256;
# PMS-104.)
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.9"
hmac = "0.12"
# SHA-1 is required only by the RFC 6238 TOTP primitive (utils::totp),
# relocated here from the removed mokosh-auth-crypto crate (PMS-295).
sha1 = "0.10"
sha2 = "0.10"
constant_time_eq = "0.3"

# CIDR parsing for the trusted-proxy allowlist that gates X-Forwarded-For
# client-IP extraction (PMS-587).
ipnetwork = { workspace = true }

# IP -> country lookup for login-location alerts (PMS-657); reads the same
# IP2Location LITE .BIN the ecosystem already deploys (see dmarc-reporter).
ip2location = "0.6"

# Rate limiting
governor = "0.8"

# Caching
moka = { version = "0.12", features = ["future"] }

# Decimal
rust_decimal = { version = "1", features = ["db-postgres", "serde"] }

# Markdown
pulldown-cmark = "0.12"

# Templates
minijinja = "2"

# Regex
regex = "1"

# Cron
cron = "0.15"

# RFC 5545 recurrence-rule (RRULE) expansion for recurring appointments
# (PMS-58). Expansion happens in-memory at read time, bounded by the
# requested range; recurring rows are never materialised in the DB.
rrule = "0.14"

# URL
url = "2"

# Cookies (for the Google OAuth state cookie)
cookie = "0.18"

# Reusable Google OAuth helper (workspace member)
google-oauth-flow = { path = "crates/google-oauth-flow" }

# Shared DTOs (workspace member). The `models.rs` for each shared
# module (auth, contacts, tenants, tickets, time_tracking) re-exports
# from `mokosh_types::<module>::*`; same crate is consumed by
# mokosh-clients to keep the wire format in lock-step (PMS-129).
mokosh-types = { path = "crates/mokosh-types" }

# Shared Stripe primitives (DEV-495 / DEV-514): constant-time webhook signature
# verification, event-envelope parsing, money conversion. Consumed identically
# by a8n-tools and bunyip so the same defect is not solved three times. Pinned by
# rev (not branch) so a dunite bump is an explicit reviewable diff, mirroring
# bunyip's dunite pins. Re-pin to the merged commit once dunite PR #27 lands.
dunite-stripe-core = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "0734f2adb4a7a85a29ae32815527d93b8efc06cb" }

[dev-dependencies]
# `test-util` exposes `tokio::time::{pause, advance, resume}` for
# deterministic virtual-clock tests (used by tests/scheduler.rs).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
# Integration-test HTTP client. Tests pull the bearer token out of the
# login JSON body and attach it via `.bearer_auth(&token)` on each call,
# so no cookie jar is required (the legacy AuthMiddleware authenticates
# from `Authorization: Bearer ...`, not from a cookie).
# `multipart` is on for the PMS-483 attachment-upload integration tests.
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
# Drive #[sqlx::test] from this crate's test binaries. The macro reads
# DATABASE_URL and provisions a fresh database per test invocation. The
# `rust_decimal` feature lets test fixtures bind `Decimal` money columns
# directly instead of interpolating SQL literals (PMS-199).
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros", "rust_decimal"] }
# Name the `Decimal` type in test fixtures that bind money columns.
rust_decimal = { version = "1", features = ["db-postgres", "serde"] }
# PMS-711: sign a synthetic Stripe webhook (`t=<ts>,v1=<hmac>`) in
# tests/pms711_stripe_pay_now.rs so the paid/refund paths run through the real
# signature verification, not a bypass.
hmac = "0.12"
sha2 = "0.10"

[build-dependencies]
# Shared build-script logic (PMS-198). build.rs calls build_metadata::emit().
build-metadata = { path = "crates/build-metadata" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
