# Per-developer Traefik-routed dev instance for SSO testing.
#
# Layered ON TOP of compose.dev.yml:
#   docker compose -f compose.dev.yml -f compose.dev-sso.yml up --build --detach
#
# `just dev-sso` is the supported entry point.
#
# What this overlay changes:
#   - mokosh-server stops binding to the host LAN IP (Traefik does the
#     terminating instead) and joins the shared `traefik-public` network.
#   - Traefik labels route https://${USER}-mokosh-api.a8n.run to the
#     container's $MOKOSH_PORT.
#   - SSO env vars are pinned to the public URL so issued JWTs carry the
#     right `iss` and the cookie domain spans `.a8n.run`.
#
# The project name is intentionally NOT redefined here. The base
# compose.dev.yml already sets `name: dev-mokosh` and binds an explicit
# per-developer network name (`dev-mokosh-private-${USER}`); overriding
# the project name would make compose see that network as foreign and
# refuse to start. Per-developer isolation lives in container_name +
# Traefik label keys, not in the project name.

services:

  # Service key MUST match the base file's `server`. main's
  # ba236ae refactor renamed the base service from `mokosh-server` to
  # `server`; if we use the old key here, compose treats this as a new
  # service definition with neither image nor build context and
  # refuses to start.
  server:
    container_name: dev-mokosh-server-${USER}
    networks:
      - private
      - traefik-public
    # Remove the LAN-IP host port binding from compose.dev.yml; Traefik
    # is the only ingress for this profile.
    ports: !reset []
    # List (sequence) syntax is REQUIRED here, not the usual map syntax.
    # Docker Compose interpolates ${USER} inside string VALUES but NOT
    # inside map KEYS (verified on Compose v2.40). The router name lives
    # in the label key, so map syntax leaves a literal `${USER}` in the
    # router name, Traefik rejects it, and the host never routes (default
    # cert + 404). In list form the whole "key=value" is one string value,
    # so ${USER} in the router name interpolates correctly.
    labels:
      - traefik.enable=true
      - traefik.docker.network=network-traefik-public
      - traefik.http.routers.mokosh-api-${USER}.rule=Host(`${USER}-mokosh-api.a8n.run`)
      - traefik.http.routers.mokosh-api-${USER}.entrypoints=nebula-secure
      - traefik.http.routers.mokosh-api-${USER}.tls.certresolver=cert-cloudflare
      - traefik.http.services.mokosh-api-${USER}.loadbalancer.server.port=${MOKOSH_PORT}
    # bunyip-as-OP cutover (runbook 3.8 / scaffold step 8): mokosh-server runs
    # as a Resource Server. The auth middleware's BunyipVerifier (oidc_rs.rs)
    # validates the at+jwt bunyip-api mints by fetching bunyip's discovery +
    # JWKS over HTTPS and JIT-provisioning the user, activated purely by
    # OIDC_ISSUER + OIDC_AUDIENCE below.
    #
    # The verifier fetches `${OIDC_ISSUER}/.well-known/openid-configuration`,
    # but inside the container the issuer host resolves to dev-01's PUBLIC edge
    # (self-signed cert + 404 on the OP path). This extra_hosts entry pins it to
    # the LOCAL Traefik on the shared network, which serves the OP with a valid
    # Let's Encrypt cert. Override BUNYIP_OP_TRAEFIK_IP in .env on a box whose
    # Traefik publishes nebula-secure on a different IP.
    extra_hosts:
      - "${USER}-bunyip-api.a8n.run:${BUNYIP_OP_TRAEFIK_IP:-172.30.0.11}"
    environment:
      # mokosh-server keeps its OWN issuer identity for its (now-unused) OP
      # endpoints; token validation is done by the RS verifier below, NOT this.
      MOKOSH_AUTH_ISSUER: https://${USER}-mokosh-api.a8n.run
      # RS verifier (the bunyip-as-OP path). OIDC_ISSUER must equal the token
      # `iss` AND bunyip's advertised discovery issuer; OIDC_AUDIENCE must equal
      # the `audience` on the mokosh-apps oauth_clients row in bunyip-api.
      OIDC_ISSUER: https://${USER}-bunyip-api.a8n.run
      OIDC_AUDIENCE: https://${USER}-mokosh-api.a8n.run
      # Cross-subdomain SSO: cookies span every *.a8n.run app this user
      # might add later. Mirrors saas / dmarc-reporter behaviour.
      MOKOSH_AUTH_COOKIE_DOMAIN: .a8n.run
      # Keys live in ./secrets, mounted at /app/secrets:ro by compose.dev.yml.
      # `just ensure-oidc-keys` generates mokosh's own dev-key (for its own OP
      # endpoints to boot); the RS path fetches bunyip's keys over JWKS, so no
      # cross-service key copy is needed.
      MOKOSH_AUTH_JWT_PRIVATE_KEY_PATH: /app/secrets/dev-key.pem
      MOKOSH_AUTH_JWT_ACTIVE_KID: dev-key
      MOKOSH_AUTH_JWT_PUBLIC_KEYS_DIR: /app/secrets
      # Account-management email links (invites, password reset, signup
      # complete) land on bunyip - it owns the user-account surface.
      # mokosh-clients no longer hosts those pages once the bunyip hub
      # is live; see docs/bunyip/07-sso-redirect-bridge.md.
      MOKOSH_ACCEPT_BASE_URL: http://${USER}-bunyip.a8n.run
      # Universal sign-in URL. /oauth2/authorize 302s unauthenticated
      # users here with ?return_to=<authorize_query> so bunyip's login
      # is the only sign-in screen any RP ever uses. Bunyip's LoginPage
      # validates return_to, runs the password+MFA dance, then bounces
      # to ${issuer}/oauth2/authorize?<return_to> so the freshly-set OP
      # cookie closes the loop. See docs/bunyip/07-sso-redirect-bridge.md.
      MOKOSH_AUTH_LOGIN_URL: https://${USER}-bunyip.a8n.run/login
      # Enable public self-signup. PSA hub deploys keep this off
      # (registration is admin-invite-gated); the a8n / individual SKU
      # turns it on. Dev defaults on so we can smoke-test the flow.
      # See docs/mokosh-auth/10-memberships-and-self-signup.md.
      MOKOSH_PUBLIC_SIGNUP_ENABLED: "true"

networks:
  # The base compose.dev.yml owns and creates this network as
  # `dev-mokosh-private-${USER}` (per-developer). The name here MUST
  # match that exactly: if it drifts (e.g. a non-suffixed
  # `dev-mokosh-private`), the overlay attaches the server to a
  # different network than the one Postgres + the other deps sit on, so
  # the server can no longer resolve `postgres` and crash-loops on the
  # DB connect. We mark it external here so the overlay only ATTACHES
  # rather than re-claiming ownership; because external means compose
  # will NOT create it, `just ensure-private-network` creates the same
  # per-user name defensively so a fresh host also works.
  private:
    external: true
    name: dev-mokosh-private-${USER}
  traefik-public:
    name: network-traefik-public
    external: true
